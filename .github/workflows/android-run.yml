name: android-run

# Install the PUBLISHED launcher APK on an x86_64 emulator, launch it, let the
# updater run, and dump the crash/log to annotations (readable via the public
# check-runs API — no auth). Diagnoses the "downloads then crashes" runtime issue
# without needing a physical device. Trigger:  git tag android-run-N && git push ...
on:
  workflow_dispatch:
  push:
    tags:
      - 'android-run-*'

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Download published APK
        run: |
          curl -sL "https://github.com/briankeegan/panel-game/releases/download/launcher/unofficial-panel-attack-ffa-and-team-android.apk" -o app.apk
          ls -lh app.apk

      - name: Run on emulator + dump crash log
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          script: |
            set +e
            echo "::warning title=APK_ABIS::$(unzip -l app.apk | grep -o 'lib/[^/]*' | sort -u | tr '\n' ' ')"
            adb install -r app.apk
            PKG=com.panelattack.ffateam
            adb logcat -c
            # stream ALL logcat to a file in the background so nothing is lost even if
            # a foreground adb call flakes; hardcode PKG (pm path hung the emulator).
            ( adb logcat -v brief > /tmp/full.log 2>&1 ) &
            adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 >/dev/null 2>&1
            for i in $(seq 1 30); do sleep 2; done
            PROC=$(adb shell pidof "$PKG" 2>/dev/null | tr -d '\r')
            echo "::warning title=PROC::${PROC:-DEAD_crashed_or_exited}"
            echo "::warning title=CRASH::$(adb logcat -d -b crash 2>/dev/null | tail -12 | tr '\n' '|' | cut -c1-1600)"
            echo "::warning title=FATAL::$(grep -aiE 'fatal|signal |sigsegv|abort|backtrace|dlopen|unsatisfiedlink|cannot load|java.lang' /tmp/full.log 2>/dev/null | tail -12 | tr '\n' '|' | cut -c1-1600)"
            echo "::warning title=LOVE::$(grep -aiE 'love|lua|sdl|liblove|https|updater|game.love|mount' /tmp/full.log 2>/dev/null | tail -15 | tr '\n' '|' | cut -c1-1600)"
            exit 0
