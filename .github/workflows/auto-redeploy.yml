name: Auto-redeploy a deployed bot

# When bot code or the bot workflow changes on one of our branches, redeploy the bots that are ALREADY deployed: it asks for
# ranmaru-deploy with `only-if-running` on each server, which does nothing where no numbered bot (Ranmaru_p9_CPU) is up.
# Waits two quiet minutes first (a newer push cancels the wait) and skips a push whose message has [skip deploy].
# (Gambit itself is built from GameCreator at run time: a merge there asks for the same deploy from GameCreator's side.)
on:
  push:
    branches: [bramp/multi-player, claude/game-bot-creation-action-0e7emk]
    paths:
      - 'bot/**'
      - '!bot/identities/**'
      - '.github/workflows/bot-prod-smoke-test.yml'

concurrency:
  group: auto-redeploy
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  redeploy:
    if: ${{ !contains(github.event.head_commit.message, '[skip deploy]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for two quiet minutes
        run: sleep 120

      - name: Ask for the redeploys (each does nothing if no numbered bot is deployed on its server)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for server in panelattack.com:49569 betaserver.panelattack.com:59569; do
            gh workflow run bot-prod-smoke-test.yml --repo "${{ github.repository }}" --ref bramp/multi-player \
              -f mode=ranmaru-deploy -f server="$server" -f bot=gambit -f advanced="only-if-running"
          done
