name: Bot Prod Smoke Test (LIVE SERVER)
# The run list shows what each run was, e.g. "live · beta · SirBonksALot".
run-name: "${{ startsWith(inputs.mode, 'ranmaru') && format('{0} · {1}', inputs.mode, inputs.server) || inputs.mode == 'versus-player' && format('live · {0} · {1}{2}', inputs.server, inputs.name, inputs.player != '' && format(',{0}', inputs.player) || '') || inputs.mode == 'fight' && !contains(inputs.advanced, 'bot_run') && format('fight-start · {0}', inputs.server) || format('{0} · {1} · {2} ({3}) vs {4}', inputs.mode, inputs.server, inputs.name, inputs.bot, inputs.opponent) }}"

# Manual-only. Pick what to do in the first box (the form is numbered in the order to fill it in):
#
#   ranmaru-deploy  stop the running Ranmaru_TEST_CPU and start a new one on GameCreator's latest main
#   ranmaru-stop    stop it and show its wins and losses in the run summary
#   versus-player   ONE bot under a real name sits in a server's lobby and plays challenges. Unranked, always.
#                   Stays up for `hours`. With a player typed in, it challenges THAT player and plays only them
#                   (Gambit); blank, it plays whoever challenges it
#   fight           pick who plays who on 104.156.250.136 (bot/fight.sh): `bot` sits in the lobby as `name`;
#                   `player` logs in as `name`2 and challenges it, rematching for `hours` -- or "you" and nobody
#                   does, you challenge it -- or "challenge" for `bot` to challenge the second name in `name` ("A,B")
#
# `advanced` is a line of key=value words, for what the form does not ask: gambit_from=<GameCreator commit or
# version name>, upstream_ref=<upstream commit/tag/branch>, profile=<weight set file>. bot/pair.sh sends it.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: '1. What to do: ranmaru-deploy = stop EVERY bot on the server (2), then start the bot in 3-4. ranmaru-stop = stop every bot on the server and show its wins and losses. versus-player = just start the bot in 3-4. fight = stop every bot on the server, then two Gambits fight: the bot in 3-4 sits in the lobby, the one in 5-6 challenges it'
        required: true
        default: 'ranmaru-deploy'
        type: choice
        options:
          - ranmaru-deploy
          - ranmaru-stop
          - versus-player
          - fight
      server:
        description: '2. Server -- the one the bot joins, and the one stop / deploy / fight clear of bots'
        required: true
        default: 'panelattack.com:49569'
        type: choice
        options:
          - panelattack.com:49569
          - 104.156.250.136:49569
          - betaserver.panelattack.com:59569
      bot:
        description: '3. Gambit (the bot in the lobby): the latest main, or a kept build named for its actions window (w150 = 150 actions in 10 seconds)'
        required: true
        default: 'gambit'
        type: choice
        options:
          - gambit
          - gambit-w150
          - gambit-w100
          - gambit-w90
          - gambit-w80
      name:
        description: '4. That bot''s name in the lobby (letters, digits, _; 16 max). A # is the next number: ranmaru-deploy swaps between the two saved accounts and renames one, so Ranmaru_p#_CPU gives p7, then p8, ... On the Bramp server (104.156.250.136) use a name that already has an account: GambitMain, Gambit_100, GambitY, SvAttack1, SvDefensive, WasmAgro_CPU or BitBot'
        required: false
        default: 'Ranmaru_p#_CPU'
      opponent:
        description: '5. Fight only: the second Gambit, who challenges the first'
        required: true
        default: 'gambit'
        type: choice
        options:
          - gambit
          - gambit-w150
          - gambit-w100
          - gambit-w90
          - gambit-w80
      opponent_name:
        description: '6. Fight only: the second Gambit''s name in the lobby (blank = the first name plus 2). Same rule on the Bramp server: use a name that already has an account'
        required: false
        default: ''
      player:
        description: '7. versus-player only: a player''s name -- the bot challenges them and plays only them. Blank = it plays whoever challenges it'
        required: false
        default: ''
      hours:
        description: '8. Hours the bots stay up'
        required: true
        default: '5'
        type: choice
        options:
          - '5'
          - '4'
          - '3'
          - '2'
          - '1'
      advanced:
        description: '9. Advanced -- leave blank. Words like gambit_from=<GameCreator commit>, upstream_ref=<commit>, profile=<file>'
        required: false
        default: ''

# The beta server runs UPSTREAM Panel Attack, whose protocol differs from the
# fork's (lockstep: each client simulates both stacks from relayed inputs; no
# garbage/death/display messages). Its bot lives in bot/ on this branch of
# THIS repo, built to run on an unmodified upstream checkout:
env:
  # versus-player is `live` under another name
  MODE: ${{ inputs.mode == 'versus-player' && 'live' || inputs.mode }}
  # versus-player with a player typed in: the bot challenges that player and plays only them (the NAME,PLAYER form the live step reads)
  BOT_NAME: ${{ inputs.mode == 'versus-player' && inputs.player != '' && format('{0},{1}', inputs.name, inputs.player) || inputs.name }}
  # The two servers `server` offers; the beta one runs upstream's protocol.
  BETA_SERVER: betaserver.panelattack.com:59569
  # the main Panel Attack server (the client's default port); it runs the upstream beta branch's game
  PROD_SERVER: panelattack.com:49569
  UPSTREAM_REPO: https://github.com/panel-attack/panel-game.git
  UPSTREAM_REF: beta
  # If whoever deploys the beta server moves this tag in the upstream repo to
  # the deployed commit, runs use exactly that build (see the fetch step).
  UPSTREAM_DEPLOYED_TAG: betaserver-live
  UPSTREAM_BOT_REF: claude/game-bot-creation-action-0e7emk

jobs:
  bot-vs-bot:
    name: Run the bot
    if: ${{ !startsWith(inputs.mode, 'ranmaru') && (inputs.mode != 'fight' || contains(inputs.advanced, 'bot_run')) }}
    runs-on: ubuntu-latest
    # A beta-server run commits a newly registered bot's account id back to
    # UPSTREAM_BOT_REF so the name can be reused (see "Save the account id").
    permissions:
      contents: write
      actions: read
    # Under the 6-hour hard cap so a `live` session stops on our timeout.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      # The `advanced` words, and the weight set the bot plays when none is given
      - name: Read the options
        env:
          ADVANCED: ${{ inputs.advanced }}
          BOT: ${{ inputs.bot }}
        run: |
          set -eu
          profile=""; gambit_from=""; upstream_ref=""; standby=""; after=""
          for w in $ADVANCED; do
            case "$w" in
              profile=*) profile=${w#profile=};;
              gambit_from=*) gambit_from=${w#gambit_from=};;
              upstream_ref=*) upstream_ref=${w#upstream_ref=};;
              bot_run=*|now) ;;   # bot_run marks a bot run started by a fight; now only matters to stop / deploy
              standby) standby=1;;   # a deploy's new bot: build everything, then wait for the older bots here to leave
              after=*) after=${w#after=};;   # ... or only for the bot with this name (the account this one takes over)
              *) echo "::error::advanced: I do not know '$w' (use profile=, gambit_from= or upstream_ref=)"; exit 1;;
            esac
          done
          # gambit-w100 etc.: Gambit of that kept build (a name in GameCreator's gambit-versions.txt)
          kind=$BOT
          case "$BOT" in gambit-*) kind=gambit; [ -n "$gambit_from" ] || gambit_from=$BOT;; esac
          [ -n "$profile" ] || profile=survivor-profiles/gambit.json
          { echo "PROFILE=$profile"; echo "GAMBIT_FROM=$gambit_from"; echo "UPSTREAM_REF=$upstream_ref"; echo "BOT_KIND=$kind"; echo "STANDBY=$standby"; echo "AFTER=$after"; } >> "$GITHUB_ENV"

      - name: Install luajit + luarocks
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit luarocks liblua5.1-0-dev build-essential unzip libreadline-dev

      - name: Install lua rocks (luasocket, luafilesystem, luautf8)
        run: |
          luarocks install --local luasocket --lua-version 5.1
          luarocks install --local luafilesystem --lua-version 5.1
          luarocks install --local luautf8 --lua-version 5.1

      # The telegraph the bot is told holds only garbage still on its way (delivered transit left out).
      - name: Link checks
        run: |
          eval "$(luarocks path --local --lua-version 5.1)"
          LUA_PATH="./?.lua;./common/lib/?.lua;$LUA_PATH" LUA_CPATH="./common/lib/?.so;./common/lib/?/?.so;$LUA_CPATH" \
            luajit bot/tests/survivalLinkTelegraphVerify.lua

      # Where the bot runs and what it connects to: this checkout for this
      # repo's server; a fresh upstream checkout (next steps) for the beta one.
      - name: Pick the server
        run: |
          set -eu
          server='${{ inputs.server }}'
          if [ "$server" = "$BETA_SERVER" ] || [ "$server" = "$PROD_SERVER" ]; then
            [ '${{ env.MODE }}' = live ] || { echo "$server is only for mode: live"; exit 1; }   # fight: the fork's client only
            dir="$GITHUB_WORKSPACE/upstream"
          else
            dir="$GITHUB_WORKSPACE"
          fi
          { echo "BOT_DIR=$dir"; echo "BOT_HOST=${server%%:*}"; echo "BOT_PORT=${server##*:}"; } >> "$GITHUB_ENV"
          echo "::notice::${{ env.MODE }} on $server"

      # THE SERVER'S OWN BUILD, AS NEAR AS CAN BE KNOWN. Nothing of upstream is
      # vendored here: every run fetches upstream and drops this repo's bot/ on
      # top, so the bot runs the server's engine without anyone merging
      # updates. bot/ touches nothing outside itself.
      #
      # WHICH upstream: the server does not report its build (the version check
      # answers only yes/no, the login carries no commit) and upstream has no
      # deploy workflow to read it from, so, in order:
      #   1. the upstream_ref input, if given -- an exact pin;
      #   2. the UPSTREAM_DEPLOYED_TAG tag, if it exists -- moved on deploy;
      #   3. the latest UPSTREAM_REF -- right whenever the server was deployed
      #      from beta's head, which is the normal case.
      - name: Check out the upstream bot
        if: (inputs.server == env.BETA_SERVER || inputs.server == env.PROD_SERVER)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.UPSTREAM_BOT_REF }}
          path: botsrc
          sparse-checkout: bot

      - name: Fetch upstream Panel Attack and add the bot
        if: (inputs.server == env.BETA_SERVER || inputs.server == env.PROD_SERVER)
        env:
          PIN: ${{ env.UPSTREAM_REF }}
        run: |
          set -eu
          if [ -n "$PIN" ]; then
            ref="$PIN"; why="pinned by the upstream_ref input"
          elif [ '${{ inputs.server }}' = "$PROD_SERVER" ]; then
            ref="$UPSTREAM_REF"; why="latest $UPSTREAM_REF (the game the main server runs)"
          elif git ls-remote --exit-code --tags "$UPSTREAM_REPO" "refs/tags/$UPSTREAM_DEPLOYED_TAG" >/dev/null; then
            ref="refs/tags/$UPSTREAM_DEPLOYED_TAG"; why="the $UPSTREAM_DEPLOYED_TAG tag (the last deploy)"
          else
            ref="$UPSTREAM_REF"; why="latest $UPSTREAM_REF (no $UPSTREAM_DEPLOYED_TAG tag; assuming the server runs it)"
          fi
          git init -q upstream
          git -C upstream fetch -q --depth 1 "$UPSTREAM_REPO" "$ref"
          git -C upstream checkout -q FETCH_HEAD
          echo "::notice::bot runs on upstream $(git -C upstream log -1 --format='%h %s') -- $why"
          [ ! -e upstream/bot ] || { echo "upstream now has its own bot/ -- refusing to overwrite it"; exit 1; }
          cp -r botsrc/bot upstream/bot
          # THE LINK TO GAMECREATOR'S BOTS IS ALWAYS THIS RUN'S: the upstream-protocol bot/ is its own client, but the
          # link it hands the board through (SurvivalLink) and its test are the ones on the ref this run was dispatched
          # on, so every bot plays upstream with the link the fork's bots play with
          for f in bot/SurvivalLink.lua bot/tests/survivalLinkTelegraphVerify.lua; do
            mkdir -p "upstream/$(dirname "$f")"; cp "$f" "upstream/$f"
          done
          (cd upstream && LUA_PATH="./?.lua;./common/lib/?.lua;$(luarocks path --local --lua-version 5.1 --lr-path);;" \
             LUA_CPATH="./common/lib/?.so;./common/lib/?/?.so;$(luarocks path --local --lua-version 5.1 --lr-cpath);;" \
             luajit bot/tests/survivalLinkTelegraphVerify.lua)

      # LIVE IS NOT THE SMOKE TEST. prod-vs logs in two throwaway accounts,
      # puts them in a PRIVATE room against each other and leaves. This logs
      # in ONE bot under a real name and keeps it up, so a human can find it
      # in the lobby and play it.
      #
      # A job is capped at 6 hours, so it is a session rather than a service:
      # re-run it, or run bot/beverly.sh on the server box under systemd for
      # something permanent.
      - name: Check the name and the weight set before connecting
        if: (env.MODE == 'live' || env.MODE == 'survival') && !(env.MODE == 'live' && (inputs.server == env.BETA_SERVER || inputs.server == env.PROD_SERVER) && (env.BOT_KIND == 'wasm' || env.BOT_KIND == 'bitbot' || env.BOT_KIND == 'gambit'))
        run: |
          set -eu
          cd "$BOT_DIR"
          n='${{ env.BOT_NAME }}'
          [ -n "$n" ] || { echo "name is empty"; exit 1; }
          [ ${#n} -le 16 ] || { echo "name '$n' is ${#n} chars; the server limit is 16"; exit 1; }
          if [ '${{ env.MODE }}' = survival ]; then
            [ '${{ inputs.server }}' = fork ] || { echo "survival plays the fork's server only"; exit 1; }
            exit 0
          fi
          [ -f '${{ env.PROFILE }}' ] || { echo "no weight set at ${{ env.PROFILE }}"; exit 1; }
          eval "$(luarocks path --local --lua-version 5.1)"
          luajit -e 'package.path="./?.lua;"..package.path; require("bot.headlessBoot");
            local b=require("bot.WeightedBrain").new({profile="${{ env.PROFILE }}"})
            print(string.format("%s loads: depth %d beam %d rise %s reaction %d",
              "${{ env.PROFILE }}", b.depth, b.beam, tostring(b.rise), b.reaction))'

      # SAME NAME, SAME ACCOUNT, EVERY RUN. A runner starts with no
      # bot/identities file, so without this every dispatch registers the name
      # afresh -- and the second dispatch of a name is denied as taken. So the
      # id is not stored: it is DERIVED from the name (lowercased) and the
      # server ip, and the same name always yields the same id. The first run
      # registers the name under it (the server accepts a well-formed
      # client-supplied id for a free name); every later run logs back in.
      # Deliberately not secret: these are bot accounts, and anyone who
      # derives the id can log in as the bot, which is fine. Names registered
      # before this existed hold a random id nobody kept and cannot be reused.
      # Fork only: upstream never accepts a client-chosen id (it always assigns
      # one), so a beta bot keeps its name by saving the id it was given
      # instead -- see "Save the account id".
      - name: Derive this name's account id
        if: env.MODE == 'live' && !(inputs.server == env.BETA_SERVER || inputs.server == env.PROD_SERVER)
        env:
          BASE_NAME: ${{ env.BOT_NAME }}
          BOT_IP: ${{ env.BOT_HOST }}
        run: |
          names="$BASE_NAME"
          mkdir -p bot/identities
          for BOT_NAME in $names; do
            id=$(BOT_NAME="$BOT_NAME" python3 -c '
          import hashlib, os
          msg = (os.environ["BOT_IP"] + "/" + os.environ["BOT_NAME"].lower()).encode()
          print("1" + str(int(hashlib.sha256(msg).hexdigest(), 16) % 10**18).zfill(18))')
            printf '%s' "$id" > "bot/identities/${BOT_NAME}_${BOT_IP}.txt"
            echo "'$BOT_NAME' logs in with account id $id (same name, same account, every run)"
          done

      # WASMSURVIVOR / BITBOT ON THE BETA SERVER (upstream Panel Attack). Same
      # bots as on the fork, from GameCreator's latest main; the client is the
      # upstream-protocol one in bot/ (branch UPSTREAM_BOT_REF), which asks them
      # for one key per frame at the one place it picks a key. BitBot's library
      # is built here from GameCreator's own native/build.sh line; WasmSurvivor
      # is a Node process beside the client (bot/SurvivalLink.lua talks to it).
      - name: Check out GameCreator (beta bot)
        if: env.MODE == 'live' && (inputs.server == env.BETA_SERVER || inputs.server == env.PROD_SERVER) && (env.BOT_KIND == 'wasm' || env.BOT_KIND == 'bitbot' || env.BOT_KIND == 'gambit')
        uses: actions/checkout@v4
        with:
          repository: briankeegan/GameCreator
          path: GameCreator
          sparse-checkout: games/the-game

      - name: The Gambit of another GameCreator commit (beta/real server)
        if: env.MODE == 'live' && (inputs.server == env.BETA_SERVER || inputs.server == env.PROD_SERVER) && env.BOT_KIND == 'gambit' && env.GAMBIT_FROM != ''
        env:
          GAMBIT_FROM: ${{ env.GAMBIT_FROM }}
        run: |
          set -eu
          cd GameCreator
          from=$(awk -v n="$GAMBIT_FROM" '$1 == n { print $2 }' games/the-game/ai/eval/gambit-versions.txt 2>/dev/null); from=${from:-$GAMBIT_FROM}
          git fetch -q --depth 1 origin "$from"
          rm -rf games/the-game/ai/gambit && git checkout FETCH_HEAD -- games/the-game/ai/gambit
          echo "GAMBIT_COMMIT=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"
          echo "::notice::Gambit of GameCreator $GAMBIT_FROM ($from)"

      - uses: actions/setup-node@v4
        if: env.MODE == 'live' && (inputs.server == env.BETA_SERVER || inputs.server == env.PROD_SERVER) && (env.BOT_KIND == 'wasm' || env.BOT_KIND == 'bitbot' || env.BOT_KIND == 'gambit')
        with:
          node-version: '22'

      - name: Sit in the lobby (beta, ${{ inputs.bot }})
        if: env.MODE == 'live' && (inputs.server == env.BETA_SERVER || inputs.server == env.PROD_SERVER) && (env.BOT_KIND == 'wasm' || env.BOT_KIND == 'bitbot' || env.BOT_KIND == 'gambit')
        id: betalink
        run: |
          set -eu
          eval "$(luarocks path --local --lua-version 5.1)"
          export GC_EVAL_DIR="$GITHUB_WORKSPACE/GameCreator/games/the-game/ai/eval"
          # name is "BOT" or "BOT,OPPONENT": the second half is a lobby name this bot challenges
          name='${{ env.BOT_NAME }}'
          # "BOT,OPPONENT" or "BOT,OPPONENT,GAMES": after GAMES finished games against OPPONENT the bot stops challenging
          # and sits in the lobby accepting whoever challenges
          games=""
          case "$name" in *,*) target=${name#*,}; name=${name%%,*};; *) target="";; esac
          case "$target" in *,*) games=${target#*,}; target=${target%%,*};; esac
          # GAMES may be "first10": a series, first to 10 wins, then back to accepting anyone
          first=""; case "$games" in first*) first=${games#first}; games="";; esac
          [ -n "$name" ] && [ ${#name} -le 16 ] || { echo "name '$name' must be 1-16 characters"; exit 1; }
          echo "::notice::GameCreator at $(git -C "$GC_EVAL_DIR" log -1 --format='%h %s' | cut -c1-120)"
          kind='${{ env.BOT_KIND }}'
          pin=""
          if [ "$kind" = bitbot ]; then
            line=$(grep -E '^clang .* -shared .*libbit\.so' "$GC_EVAL_DIR/native/build.sh" | head -1)
            (cd "$GC_EVAL_DIR/native" && eval "$line") 2> bitbot-build.log || { cat bitbot-build.log; echo "libbit.so did not build"; exit 1; }
            brain=bitbot
          elif [ "$kind" = gambit ]; then
            # GameCreator's Gambit (C, libgambit.so), built here and played in the client's own process
            # (gambit/lua/GambitNative.lua). Its profile is a path under the eval dir, as numbers (words.js).
            G="$GC_EVAL_DIR/../gambit"
            gp=survivor-profiles/gambit.json
            case '${{ env.PROFILE }}' in survivor-profiles/*) gp='${{ env.PROFILE }}';; esac
            [ -f "$GC_EVAL_DIR/$gp" ] || { echo "no Gambit profile $GC_EVAL_DIR/$gp"; exit 1; }
            sh "$G/build.sh" native > gambit-build.log 2>&1 || { cat gambit-build.log; echo "libgambit.so did not build"; exit 1; }
            GC_SURVIVOR_PROFILE="$GC_EVAL_DIR/$gp" node "$G/words.js" > "$PWD/gambit.words" 2>> gambit-build.log || { cat gambit-build.log; echo "Gambit's profile did not encode"; exit 1; }
            gc=$(git -C "$GC_EVAL_DIR" log -1 --format=%h)
            [ -z "${GAMBIT_COMMIT:-}" ] || gc="${GAMBIT_COMMIT:0:8} (gambit_from '${{ env.GAMBIT_FROM }}'; main is $gc)"
            echo "::notice::Gambit built from GameCreator $gc, profile $gp"
            export GC_GAMBIT_WORDS="$PWD/gambit.words" GC_GAMBIT_LOG="$PWD/gambit-$name.log"
            # the machine as Gambit's training gives it (GameCreator's eval/training.sh): the client on CPU 0, Gambit's own thread alone
            # on a CPU of another core, its four workers (at the idle class) on the CPUs left
            core() { cat "/sys/devices/system/cpu/cpu$1/topology/core_id" 2>/dev/null || echo "$1"; }
            gcpu="" wcpus=""
            for c in $(seq 1 $(( $(nproc) - 1 ))); do
              if [ -z "$gcpu" ] && [ "$(core "$c")" != "$(core 0)" ]; then gcpu=$c; else wcpus=${wcpus:+$wcpus,}$c; fi
            done
            [ -n "$gcpu" ] || { gcpu=0; wcpus=0; }
            export GC_GAMBIT_WORKERS=4 GC_GAMBIT_CPUS="$gcpu" GC_GAMBIT_WORKER_CPUS="${wcpus:-$gcpu}"
            pin="taskset -c 0"
            echo "::notice::Gambit: the client on CPU 0, Gambit on $gcpu, its 4 workers on ${wcpus:-$gcpu}"
            brain=gambit
          else
            prof='${{ env.PROFILE }}'
            prof_abs=""
            case "$prof" in
              *.wasm.json)
                [ -f "$prof" ] || { echo "no WasmSurvivor profile $prof"; exit 1; }
                w=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["weights"])' "$prof")
                cp "$(dirname "$prof")/$w" "$GC_EVAL_DIR/$w"
                prof_abs="$PWD/$prof"; echo "WasmSurvivor plays $prof" ;;
              *) echo "profile '$prof' is not a *.wasm.json: WasmSurvivor plays its default" ;;
            esac
            GC_SURVIVOR_PROFILE="$prof_abs" GC_SURVIVOR_KEEP=4 nohup node "$GC_EVAL_DIR/survivor.js" --port 47777 > "mind-$name.log" 2>&1 &
            for i in $(seq 1 300); do grep -q listening "mind-$name.log" && break; sleep 0.2; done
            grep -q listening "mind-$name.log" || { cat "mind-$name.log"; echo "WasmSurvivor did not start"; exit 1; }
            export PA_SURVIVOR_PORT=47777
            brain=survival
          fi
          # The defensive (default-profile) WasmSurvivor does not take time-attack challenges; the others do.
          # Gambit with a target fights ONLY that player: it answers no one else's challenge
          only=""; [ "$kind" = gambit ] && only="$target"
          decline=""; if [ "$kind" = wasm ]; then case "${prof:-}" in *.wasm.json) ;; *) decline=TWO_PLAYER_TIME_ATTACK ;; esac; fi
          cd "$BOT_DIR"
          # The server hands a new name its account id at the first login. Save it to the bot branch the
          # moment it is written, not only when the run ends: a run that dies would lose it.
          (
            f="bot/identities/${name}_${BOT_HOST}.txt"
            for i in $(seq 1 90); do
              if [ -s "$BOT_DIR/$f" ]; then
                mkdir -p "$GITHUB_WORKSPACE/botsrc/bot/identities"
                cp "$BOT_DIR/$f" "$GITHUB_WORKSPACE/botsrc/$f"
                cd "$GITHUB_WORKSPACE/botsrc"
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git add "$f"
                if git diff --cached --quiet; then echo "account id already saved"; else
                  git commit -q -m "bot: save account id for '$name' on $BOT_HOST"
                  for k in 1 2 3; do git push -q origin "HEAD:$UPSTREAM_BOT_REF" && echo "account id saved" && break; git pull -q --rebase origin "$UPSTREAM_BOT_REF"; done
                fi
                break
              fi
              sleep 2
            done
          ) > "$GITHUB_WORKSPACE/save-id-$name.log" 2>&1 &
          secs=$(( ${{ inputs.hours }} * 3600 ))
          echo "::notice::$name ($brain) joining $BOT_HOST:$BOT_PORT for ${{ inputs.hours }}h"
          set -o pipefail
          # A deploy's new bot is built by now and waits, not logged in, until every older bot on this server has left
          if [ "${STANDBY:-}" = 1 ] || [ -n "${AFTER:-}" ]; then
            # (a rename takes over the account of the bot named AFTER; it waits for that one only)
            who="live · $BOT_HOST:$BOT_PORT · ${AFTER:-}"
            echo "standby: built; waiting for the older bots (${AFTER:-all}) on $BOT_HOST:$BOT_PORT to leave"
            while :; do
              older=$(GH_TOKEN="${{ github.token }}" gh api "repos/${{ github.repository }}/actions/runs?status=in_progress&per_page=50" --jq "[.workflow_runs[] | select(.id < $GITHUB_RUN_ID) | select(.display_title | startswith(\"$who\"))] | length" 2>/dev/null || echo 1)
              [ "${older:-1}" -eq 0 ] && break
              sleep 10
            done
            echo "standby over: logging in"
          fi
          # A stop / deploy / fight-start run for this server, made after this bot started, waits on it: the file tells the bot
          # to leave once no game is running (bot/playBot.lua PA_STOP_FILE). Runs made before it started are not about it.
          export PA_STOP_FILE="$RUNNER_TEMP/stop-after-the-game"; rm -f "$PA_STOP_FILE"
          started=$(date -u +%s)
          ( while sleep 10; do
              ids=$(GH_TOKEN="${{ github.token }}" gh api "repos/${{ github.repository }}/actions/runs?status=in_progress&per_page=30" --jq ".workflow_runs[] | select(.display_title | test(\"^(ranmaru-stop|ranmaru-deploy|fight-start) · $BOT_HOST:$BOT_PORT\$\")) | select((.created_at | fromdateiso8601) > $started) | .id" 2>/dev/null || true)
              for rid in $ids; do
                # (a deploy releases the old bots only after its new bot is in the lobby: its "Cancel the running one" step has begun)
                begun=$(GH_TOKEN="${{ github.token }}" gh api "repos/${{ github.repository }}/actions/runs/$rid/jobs" --jq '[.jobs[0].steps[] | select(.name | startswith("Cancel the running one")) | select(.status != "pending")] | length' 2>/dev/null || echo 0)
                if [ "${begun:-0}" -gt 0 ]; then touch "$PA_STOP_FILE"; break 2; fi
              done
            done ) &
          # a player who does not start a game within 60 s is left alone in the room (not for a bot that challenges someone)
          idle=60; [ -z "$target" ] || idle=0
          PA_IDLE_LIMIT="$idle" PA_CHALLENGE="$target" PA_CHALLENGE_GAMES="$games" PA_CHALLENGE_FIRST_TO="$first" PA_ACCEPT_ONLY="$only" PA_DECLINE_MODES="$decline" timeout "$secs" $pin luajit bot/playBot.lua "$BOT_HOST" "$BOT_PORT" "$name" 4 12 "$brain" \
            2>&1 | tee "$GITHUB_WORKSPACE/bot-prod-smoke.log" || [ $? -eq 124 ]

      - name: Sit in the lobby
        if: env.MODE == 'live' && !(env.MODE == 'live' && (inputs.server == env.BETA_SERVER || inputs.server == env.PROD_SERVER) && (env.BOT_KIND == 'wasm' || env.BOT_KIND == 'bitbot' || env.BOT_KIND == 'gambit'))
        id: live
        env:
          PA_SEARCH_PROFILE: ${{ env.PROFILE }}
        run: |
          eval "$(luarocks path --local --lua-version 5.1)"
          secs=$(( ${{ inputs.hours }} * 3600 ))
          echo "::notice::${{ env.BOT_NAME }} joining $BOT_HOST:$BOT_PORT for ${{ inputs.hours }}h"
          cd "$BOT_DIR"
          set -o pipefail
          # The bot runs until killed, so the timeout IS the stop condition:
          # 124 from `timeout` is this working, not failing.
          timeout "$secs" bot/plamp.sh "$BOT_HOST" "$BOT_PORT" '${{ env.BOT_NAME }}' \
            2>&1 | tee "$GITHUB_WORKSPACE/bot-prod-smoke.log" || [ $? -eq 124 ]

      # WASMSURVIVOR. The survival bot is GameCreator's (survivor.js): it
      # plans on this server's own rules (its pa-engine.js / native/pa.c are
      # held to this repo's Lua engine frame by frame) and tells the client
      # what to press every frame through bot/SurvivalLink.lua. It runs beside
      # the client on this runner, on the cores the client does not use.
      - name: Check out WasmSurvivor
        if: env.MODE == 'survival'
        uses: actions/checkout@v4
        with:
          repository: briankeegan/GameCreator
          path: GameCreator
          sparse-checkout: games/the-game

      - uses: actions/setup-node@v4
        if: env.MODE == 'survival'
        with:
          node-version: '22'

      - name: Start WasmSurvivor
        if: env.MODE == 'survival'
        run: |
          set -eu
          nohup node GameCreator/games/the-game/ai/eval/survivor.js --port 47777 > "$GITHUB_WORKSPACE/survivor.log" 2>&1 &
          for i in $(seq 1 300); do grep -q listening "$GITHUB_WORKSPACE/survivor.log" && break; sleep 0.2; done
          cat "$GITHUB_WORKSPACE/survivor.log"
          grep -q listening "$GITHUB_WORKSPACE/survivor.log" || { echo "WasmSurvivor did not start"; exit 1; }

      - name: Sit in the lobby (WasmSurvivor)
        if: env.MODE == 'survival'
        id: survival
        env:
          PA_SURVIVOR_PORT: '47777'
        run: |
          eval "$(luarocks path --local --lua-version 5.1)"
          secs=$(( ${{ inputs.hours }} * 3600 ))
          echo "::notice::${{ env.BOT_NAME }} (WasmSurvivor) joining $BOT_HOST:$BOT_PORT for ${{ inputs.hours }}h"
          set -o pipefail
          timeout "$secs" luajit bot/playBot.lua "$BOT_HOST" "$BOT_PORT" '${{ env.BOT_NAME }}' 4 12 survival \
            2>&1 | tee "$GITHUB_WORKSPACE/bot-prod-smoke.log" || [ $? -eq 124 ]

      # SAME NAME, SAME ACCOUNT on beta. Upstream hands a new name a random id
      # at its first login; the bot writes it to bot/identities/, and this
      # commits it to UPSTREAM_BOT_REF so the next run logs back in instead of
      # being denied as "already taken". Not secret, on purpose: bot accounts.
      - name: Save the account id
        if: always() && (inputs.server == env.BETA_SERVER || inputs.server == env.PROD_SERVER)
        run: |
          set -eu
          n='${{ env.BOT_NAME }}'; n=${n%%,*}   # (a "BOT,OPPONENT" name: the account is the bot's)
          f="bot/identities/${n}_${BOT_HOST}.txt"
          [ -f "upstream/$f" ] || { echo "no id to save"; exit 0; }
          if [ -f "botsrc/$f" ] && cmp -s "upstream/$f" "botsrc/$f"; then echo "id already saved"; exit 0; fi
          mkdir -p "botsrc/bot/identities"
          cp "upstream/$f" "botsrc/$f"
          cd botsrc
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$f"
          git commit -m "bot: save account id for '${{ env.BOT_NAME }}' on $BOT_HOST"
          for i in 1 2 3; do
            git push origin "HEAD:$UPSTREAM_BOT_REF" && exit 0
            git pull --rebase origin "$UPSTREAM_BOT_REF"
          done
          exit 1

      # BITBOT and WASMSURVIVOR come from GameCreator's latest main. BitBot is
      # C: fight.sh builds its libbit.so (the line in GameCreator's
      # native/build.sh) and the client plays it in-process
      # (bot/BitBotNative.lua, as GameCreator's lua/train.lua does).
      - name: Check out GameCreator (BitBot, WasmSurvivor)
        if: env.MODE == 'fight' && (contains(fromJSON('["bitbot","bitbotwasm","wasm","gambit"]'), env.BOT_KIND) || contains(fromJSON('["bitbot","bitbotwasm","wasm","gambit"]'), inputs.player))
        uses: actions/checkout@v4
        with:
          repository: briankeegan/GameCreator
          path: GameCreator
          sparse-checkout: games/the-game

      - name: The Gambit of another GameCreator commit (fight)
        if: env.MODE == 'fight' && env.BOT_KIND == 'gambit' && env.GAMBIT_FROM != ''
        env:
          GAMBIT_FROM: ${{ env.GAMBIT_FROM }}
        run: |
          set -eu
          cd GameCreator
          from=$(awk -v n="$GAMBIT_FROM" '$1 == n { print $2 }' games/the-game/ai/eval/gambit-versions.txt 2>/dev/null); from=${from:-$GAMBIT_FROM}
          git fetch -q --depth 1 origin "$from"
          rm -rf games/the-game/ai/gambit && git checkout FETCH_HEAD -- games/the-game/ai/gambit
          echo "::notice::Gambit of GameCreator $GAMBIT_FROM ($from)"

      - uses: actions/setup-node@v4
        if: env.MODE == 'fight' && (contains(fromJSON('["bitbot","bitbotwasm","wasm","gambit"]'), env.BOT_KIND) || contains(fromJSON('["bitbot","bitbotwasm","wasm","gambit"]'), inputs.player))
        with:
          node-version: '22'

      # FIGHT: bot/fight.sh does it all -- accounts, BitBot's link and its
      # pre-flight when BitBot plays (nothing joins the lobby if that fails),
      # then `bot` in the lobby and `opponent` challenging it.
      - name: Fight
        if: env.MODE == 'fight'
        id: fight
        env:
          GC_EVAL_DIR: ${{ github.workspace }}/GameCreator/games/the-game/ai/eval
          WASM_PROFILE: ${{ env.PROFILE }}
        run: |
          eval "$(luarocks path --local --lua-version 5.1)"
          [ "${BOT_HOST}:${BOT_PORT}" != "$BETA_SERVER" ] && [ "${BOT_HOST}:${BOT_PORT}" != "$PROD_SERVER" ] || { echo "fight plays the fork's server only"; exit 1; }
          if [ -d GameCreator ]; then echo "::notice::GameCreator $(git -C GameCreator log -1 --format='%h %s')"; fi
          echo "::notice::${{ env.BOT_NAME }} (${{ env.BOT_KIND }}) vs ${{ inputs.player || 'you' }} on $BOT_HOST:$BOT_PORT for ${{ inputs.hours }}h"
          set -o pipefail
          bot/fight.sh "$BOT_HOST" "$BOT_PORT" $(( ${{ inputs.hours }} * 3600 )) '${{ env.BOT_KIND }}' '${{ env.BOT_NAME }}' '${{ inputs.player || 'you' }}' \
            2>&1 | tee bot-prod-smoke.log

      # A new name's account id, made by the server at its first login, is
      # committed back to the branch this ran from, so the next run logs back
      # in as the same account (fight.sh reads bot/identities/). Runs on
      # cancel too: an id is saved however the run ends.
      - name: Save new account ids
        if: always() && env.MODE == 'fight'
        run: |
          set -u
          added=""
          for f in bot/identities/*_"$BOT_HOST".txt; do
            [ -s "$f" ] || continue
            git ls-files --error-unmatch "$f" >/dev/null 2>&1 && continue
            git add -f "$f" && added="$added $(basename "$f" "_$BOT_HOST.txt")"
          done
          [ -n "$added" ] || { echo "no new account ids"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "bot: save account ids for$added on $BOT_HOST"
          for i in 1 2 3 4; do
            git push origin "HEAD:refs/heads/${{ github.ref_name }}" && { echo "saved:$added"; exit 0; }
            git pull --rebase origin "${{ github.ref_name }}"
          done
          echo "::error::could not save account ids for$added"; exit 1

      - name: Per-game sanity (gambit)
        if: always() && env.MODE == 'live' && env.BOT_KIND == 'gambit'
        run: |
          # Gambit carries state between games when something is not reset per game. These checks show it:
          # every game must open in "opener", no game may fall back to "time attack" after its first
          # 300 frames, and the share of lines with the opponent read as topped out must not climb.
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY" || true
          import glob, re
          for f in sorted(glob.glob("gambit-*.log")):
              games, prev = [], None
              for l in open(f, errors="ignore"):
                  m = re.match(r"GAMBITD (\d+) ([a-z ]+?) play=.* enemy=\d+/(\d+)/", l) or re.match(r"GAMBITD (\d+) ([a-z ]+?) play=", l)
                  if not m:
                      continue
                  c = int(m.group(1))
                  if prev is None or c < prev - 500:
                      games.append([])
                  prev = c
                  games[-1].append((c, m.group(2), int(m.group(3)) if m.lastindex >= 3 else None))
              print(f"## Per-game sanity: {f} ({len(games)} games)")
              bad = [i + 1 for i, g in enumerate(games) if g and g[0][1] != "opener"]
              late = [i + 1 for i, g in enumerate(games) if any(s == "time attack" and c > 300 for c, s, _ in g)]
              def share(gs):
                  n = sum(1 for g in gs for _, _, o in g if o is not None)
                  return sum(1 for g in gs for _, _, o in g if o == 1) / n if n else 0
              k = max(1, len(games) // 3)
              first, last = share(games[:k]), share(games[-k:])
              print(f"- games not opening in 'opener': {bad or 'none'}")
              print(f"- games in 'time attack' after frame 300: {late or 'none'}")
              print(f"- opponent read as topped out, first third {first:.2f} vs last third {last:.2f}")
              if bad or late or last > first + 0.15:
                  print("**State is carrying over between games.**")
                  print(f"::warning::{f}: per-game state is carrying over (see the job summary)")
          PY

      - name: Summary
        if: always()
        run: |
          {
            echo "## Bot (${{ env.MODE }}) — ${{ inputs.server }}"
            echo ""
            echo '```'
            tail -n 40 bot-prod-smoke.log || echo "(no log produced)"
            echo '```'
            for f in bitbot-mind.log mind-*.log; do [ -f "$f" ] || continue; echo "### $f"; echo '```'; tail -n 40 "$f"; echo '```'; done
            if [ -f GameCreator/games/the-game/ai/eval/survivor_runsummary.js ] && ls fight-*.log >/dev/null 2>&1; then
              echo "## The run's own report"
              node GameCreator/games/the-game/ai/eval/survivor_runsummary.js . 2>&1 | tail -n 30 || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-prod-smoke-log
          path: |
            bot-prod-smoke.log
            bitbot-mind.log
            bitbot-preflight.log
            mind-*.log
            preflight-*.log
            save-id-*.log
            fight-*.log
            gambit-*.log
            death-*.jsonl.gz
            frames-*.jsonl.gz

      - name: Fail if the run failed
        if: steps.smoke.outcome == 'failure' || steps.largegarbage.outcome == 'failure' || steps.live.outcome == 'failure' || steps.fight.outcome == 'failure'
        run: exit 1

  # ranmaru-deploy / ranmaru-stop: stop (and start) the bot named in the form (Run workflow -> branch bramp/multi-player -> mode).
  #   ranmaru-stop    cancels EVERY bot run on `server` (whatever its name), waits for them to finish, and writes their
  #                   wins and losses into this run's summary (the logs stay in each run's bot-prod-smoke-log artifact)
  #   ranmaru-deploy  does the same, then starts a new versus-player run with the form's name, bot, player, hours,
  #                   server and advanced words (Gambit of GameCreator's latest main unless advanced pins one)
  ranmaru:
    name: Stop / deploy / fight
    if: ${{ startsWith(inputs.mode, 'ranmaru') || (inputs.mode == 'fight' && !contains(inputs.advanced, 'bot_run')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      actions: write
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      NAME: ${{ inputs.name }}
      SERVER: ${{ inputs.server }}
      BOT: ${{ inputs.bot }}
      OPPONENT: ${{ inputs.opponent }}
      OPPONENT_NAME: ${{ inputs.opponent_name }}
      PLAYER: ${{ inputs.player }}
      HOURS: ${{ inputs.hours }}
      ADVANCED: ${{ inputs.advanced }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out the bot branch (the saved accounts)
        if: ${{ inputs.mode == 'ranmaru-deploy' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ env.UPSTREAM_BOT_REF }}
          path: botsrc

      # The new bot starts first. A name with a # takes the next number and the OLDER of the two saved accounts (the server
      # renames an account at login), so it can log in while the other bot finishes its game and leaves.
      - name: Start the new bot
        if: ${{ inputs.mode == 'ranmaru-deploy' }}
        run: |
          set -eu
          host=${SERVER%%:*}
          new="$NAME"; extra="standby"
          case "$NAME" in
            *'#'*)
              prefix=${NAME%%#*}; suffix=${NAME#*#}
              nums=$(ls botsrc/bot/identities | sed -n "s/^${prefix}\([0-9][0-9]*\)${suffix}_${host}\.txt\$/\1/p" | sort -n)
              last=$(echo "$nums" | tail -n 1); last=${last:-0}
              new="${prefix}$((last + 1))${suffix}"
              [ ${#new} -le 16 ] || { echo "::error::'$new' is longer than 16 characters"; exit 1; }
              extra=""
              if [ "$(echo "$nums" | grep -c .)" -ge 2 ]; then
                donor_n=$(echo "$nums" | tail -n 2 | head -n 1)
                donor="${prefix}${donor_n}${suffix}"
                (cd botsrc
                 git config user.name "github-actions"; git config user.email "actions@github.com"
                 git mv "bot/identities/${donor}_${host}.txt" "bot/identities/${new}_${host}.txt"
                 git commit -q -m "bot: the account of '$donor' is now '$new' on $host"
                 for k in 1 2 3; do git push -q origin "HEAD:$UPSTREAM_BOT_REF" && break; git pull -q --rebase origin "$UPSTREAM_BOT_REF"; done)
                extra="after=$donor"
                echo "$new takes over the account of $donor (the server renames it at login)" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "::error::only two accounts are ever used, renamed in turn, and fewer than two are saved for '$NAME' on $host -- save them first (bot/identities)"; exit 1
              fi;;
          esac
          gh workflow run bot-prod-smoke-test.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" \
            -f mode=versus-player -f server="$SERVER" -f bot="$BOT" -f name="$new" -f player="$PLAYER" \
            -f hours="$HOURS" -f advanced="$ADVANCED $extra"
          echo "A new run was started: $new ($BOT) on $SERVER for $HOURS hours. It logs in as soon as its account is free; the older bots finish their games and leave." >> "$GITHUB_STEP_SUMMARY"

      # The old bots are released only once the new one has been in the lobby for a while without failing (a login the
      # server refuses ends its run at once), so a refused rename never leaves the lobby empty.
      - name: Wait for the new bot to be in the lobby
        if: ${{ inputs.mode == 'ranmaru-deploy' && contains(inputs.name, '#') }}
        run: |
          set -u
          repo="${{ github.repository }}"
          began=$(gh api "repos/$repo/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          for _ in $(seq 1 120); do
            id=$(gh api "repos/$repo/actions/runs?event=workflow_dispatch&per_page=30" --jq ".workflow_runs[] | select(.created_at > \"$began\") | select(.display_title | startswith(\"live · $SERVER · \")) | .id" | head -n 1)
            if [ -n "$id" ]; then
              status=$(gh api "repos/$repo/actions/runs/$id" --jq '.status + " " + (.conclusion // "")')
              case "$status" in completed*) echo "::error::the new bot's run ($id) ended before it was in the lobby ($status): the old bots are left alone"; exit 1;; esac
              up=$(gh api "repos/$repo/actions/runs/$id/jobs" --jq '[.jobs[0].steps[] | select(.name | startswith("Sit in the lobby (beta")) | select(.status == "in_progress") | ((now - (.started_at | fromdateiso8601)) | floor)] | first // 0')
              if [ "${up:-0}" -ge 45 ]; then echo "the new bot ($id) has been in the lobby for ${up}s: releasing the old bots"; exit 0; fi
            fi
            sleep 10
          done
          echo "::error::the new bot was not in the lobby after 20 minutes: the old bots are left alone"; exit 1

      - name: Cancel the running one and pull down its info
        run: |
          set -u
          repo="${{ github.repository }}"
          # only the runs that were already there when this one was made (the deploy's new bot is not one of them)
          began=$(gh api "repos/$repo/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          # every bot run on this server, whatever its name: "live · SERVER · NAME[,PLAYER]" and "fight · SERVER · ..."
          runs() { gh api "repos/$repo/actions/runs?per_page=60" --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID) | select(.created_at < \"$began\") | select(.display_title | startswith(\"live · $SERVER · \") or startswith(\"fight · $SERVER · \")) | select($1) | .id"; }
          ids=$(runs '.status != "completed"')
          now=0; case " $ADVANCED " in *" now "*) now=1;; esac
          # A lobby bot (a "live" run) is not interrupted: it sees this run, finishes the game it is in and leaves, and this
          # run waits for that however long it takes. `now` in Advanced cancels at once; a fight.sh bot is always cancelled.
          waiting=""
          for id in $ids; do
            t=$(gh api "repos/$repo/actions/runs/$id" --jq .display_title)
            case "$t" in "live · "*) if [ "$now" = 0 ]; then waiting="$waiting $id"; continue; fi;; esac
            echo "cancelling $id"; gh api -X POST "repos/$repo/actions/runs/$id/cancel" >/dev/null || true
          done
          if [ -n "$waiting" ]; then
            echo "waiting for the bots to finish their games and leave:$waiting"
            n=0
            while :; do
              left=""
              for id in $waiting; do
                [ "$(gh api "repos/$repo/actions/runs/$id" --jq .status)" = completed ] || left="$left $id"
              done
              [ -n "$left" ] || break
              n=$((n + 1)); [ $((n % 20)) -ne 0 ] || echo "still waiting for:$left (put 'now' in Advanced to cancel them)"
              sleep 15
            done
          fi
          for id in $ids; do
            for _ in $(seq 1 60); do
              [ "$(gh api "repos/$repo/actions/runs/$id" --jq .status)" = completed ] && break
              sleep 5
            done
          done
          # the runs to report on: the ones just cancelled, else the latest finished one
          [ -n "$ids" ] || ids=$(runs '.status == "completed"' | head -n 1)
          {
            echo "## Bots on $SERVER"
            if [ -z "$ids" ]; then echo "No bot run on $SERVER found."; fi
          } >> "$GITHUB_STEP_SUMMARY"
          for id in $ids; do
            mkdir -p "pulled/$id"
            gh run download "$id" -n bot-prod-smoke-log -D "pulled/$id" 2>/dev/null || true
            python3 .github/scripts/ranmaru_summary.py "$id" "https://github.com/$repo/actions/runs/$id" "pulled/$id" >> "$GITHUB_STEP_SUMMARY"
          done
          # bots still up on other servers (not touched)
          others=$(gh api "repos/$repo/actions/runs?status=in_progress&per_page=60" --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID) | select(.display_title | startswith(\"live · \") or startswith(\"fight · \")) | select(.display_title | contains(\" · $SERVER · \") | not) | \"- \" + .display_title + \" (run \" + (.id|tostring) + \")\"")
          if [ -n "$others" ]; then { echo; echo "### Still up on other servers (not touched)"; echo "$others"; } >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Fight
        if: ${{ inputs.mode == 'fight' }}
        run: |
          case "$NAME$OPPONENT_NAME" in *'#'*) echo "::error::a fight needs real names (no #): type them in 4 and 6"; exit 1;; esac
          # two bot runs: the lobby bot waits, the challenger challenges it (its name: the form's, else NAME + 2)
          other="$OPPONENT_NAME"
          [ -n "$other" ] || { other="${NAME}2"; [ ${#other} -le 16 ] || other="${NAME:0:15}2"; }
          [ ${#other} -le 16 ] || { echo "::error::the second bot's name '$other' is longer than 16 characters"; exit 1; }
          [ "$other" != "$NAME" ] || { echo "::error::the two bots need different names"; exit 1; }
          if [ "$SERVER" = "104.156.250.136:49569" ]; then
            # the fork's server: each bot is a fight.sh run -- the lobby bot, and the challenger ("OTHER,LOBBY" challenges LOBBY)
            gh workflow run bot-prod-smoke-test.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" \
              -f mode=fight -f server="$SERVER" -f bot="$BOT" -f name="$NAME" -f player=you \
              -f hours="$HOURS" -f advanced="$ADVANCED bot_run=1"
            sleep 75   # the server makes a new name's account at its first login, one at a time: the second bot waits for the first
            gh workflow run bot-prod-smoke-test.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" \
              -f mode=fight -f server="$SERVER" -f bot="$OPPONENT" -f name="$other,$NAME" -f player=challenge \
              -f hours="$HOURS" -f advanced="$ADVANCED bot_run=1"
          else
            gh workflow run bot-prod-smoke-test.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" \
              -f mode=versus-player -f server="$SERVER" -f bot="$BOT" -f name="$NAME" -f hours="$HOURS" -f advanced="$ADVANCED"
            sleep 75   # the server makes a new name's account at its first login, one at a time: the second bot waits for the first
            gh workflow run bot-prod-smoke-test.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" \
              -f mode=versus-player -f server="$SERVER" -f bot="$OPPONENT" -f name="$other" -f player="$NAME" \
              -f hours="$HOURS" -f advanced="$ADVANCED"
          fi
          echo "A fight was started on $SERVER for $HOURS hours: $NAME ($BOT) waits in the lobby, $other ($OPPONENT) challenges it." >> "$GITHUB_STEP_SUMMARY"
