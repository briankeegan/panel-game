name: Bot Prod Smoke Test (LIVE SERVER)
# The run list shows what each run was, e.g. "live · beta · SirBonksALot".
run-name: "${{ inputs.mode }} · ${{ inputs.server }}${{ inputs.mode == 'live' && format(' · {0}', inputs.name) || inputs.mode == 'fight' && format(' · {0} ({1}) vs {2}', inputs.name, inputs.bot, inputs.opponent) || '' }}"

# Manual-only. Three things, picked with `mode`:
#
#   live           ONE bot under a real name sits in a server's lobby and
#                  auto-accepts challenges, so a person can play it. Unranked,
#                  always. Stays up for `hours`. `server` is one of two:
#                    104.156.250.136:49569           this repo's server
#                    betaserver.panelattack.com:59569 upstream Panel Attack's
#                            beta server; the bot runs on upstream's latest
#                            code with its bot/ added
#   fight          pick who plays who on 104.156.250.136 (bot/fight.sh): `bot`
#                  sits in the lobby as `name`; `opponent` logs in as `name`2
#                  and challenges it, rematching for `hours` -- or, as "you",
#                  nobody does and you challenge it. Roster: bitbot (GameCreator's
#                  BitBot, its latest main, pre-flighted before it goes live),
#                  wasm (GameCreator's WasmSurvivor, same), beverly, plamp,
#                  heuristic.
#   prod-vs        smoke test: two throwaway bots play `matches` games against
#                  each other in a PRIVATE room on 104.156.250.136; no player
#                  can join, nothing is ranked
#   large-garbage  offline benchmark on the runner, no server contact:
#                  survival vs 6x12 garbage blocks over `matches` seeds
#
# The inputs below are in the order you would fill them in; each one says
# which mode it is for. Leave the rest alone.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to run: live = a bot in the lobby for people to play; fight = pick who plays who (bot and opponent below); prod-vs = bot-vs-bot smoke test; large-garbage = offline benchmark'
        required: true
        default: 'live'
        type: choice
        options:
          - live
          - fight
          - prod-vs
          - large-garbage
      server:
        description: 'live: which server the bot joins'
        required: true
        default: '104.156.250.136:49569'
        type: choice
        options:
          - 104.156.250.136:49569
          - panelattack.com:49569
          - betaserver.panelattack.com:59569
      name:
        description: 'live: the bot''s name in the lobby (letters, digits, _; 16 max). Reusing a name logs into the same account'
        required: false
        default: 'Beverly'
      hours:
        description: 'live: how long it stays in the lobby, 1-5 hours (cancel the run to stop it sooner)'
        required: false
        default: '5'
      bot:
        description: 'fight: who sits in the lobby as `name`. live on the beta server: wasm or bitbot play it with GameCreator''s bots; anything else runs the weighted bot of `profile`'
        required: false
        default: 'beverly'
        type: choice
        options:
          - bitbot
          - bitbotwasm
          - wasm
          - beverly
          - plamp
          - heuristic
          - gambit
      opponent:
        description: 'fight: who challenges it as `name`2, over and over -- or "you" to leave it waiting for people, or "challenge" to have `bot` challenge the second name in `name` ("A,B") that sits in the lobby in ANOTHER run -- one runner each'
        required: false
        default: 'you'
        type: choice
        options:
          - you
          - challenge
          - bitbot
          - bitbotwasm
          - wasm
          - beverly
          - plamp
          - heuristic
          - gambit
      profile:
        description: 'live: which trained bot to play as (a file in bot/profiles/). fight with wasm: a bot/profiles/*.wasm.json plays those trained weights (e.g. bot/profiles/wasmbot.wasm.json)'
        required: false
        default: 'bot/profiles/beverly.json'
      matches:
        description: 'prod-vs: games to play (~2.5 min each). large-garbage: seeds to run'
        required: false
        default: '3'
      difficulty:
        description: 'prod-vs / large-garbage: bot difficulty'
        required: false
        default: 'hard'
      upstream_ref:
        description: 'Advanced, betaserver only: run the bot on this upstream commit/tag/branch instead of the latest beta. Only needed if the server is not on latest beta'
        required: false
        default: ''
      gambit_from:
        description: 'fight with gambit: play the Gambit (games/the-game/ai/gambit) of this GameCreator commit, or of a version named in its games/the-game/ai/eval/gambit-versions.txt, instead of its latest main'
        required: false
        default: ''

# The beta server runs UPSTREAM Panel Attack, whose protocol differs from the
# fork's (lockstep: each client simulates both stacks from relayed inputs; no
# garbage/death/display messages). Its bot lives in bot/ on this branch of
# THIS repo, built to run on an unmodified upstream checkout:
env:
  # The two servers `server` offers; the beta one runs upstream's protocol.
  BETA_SERVER: betaserver.panelattack.com:59569
  # the main Panel Attack server (the client's default port); it runs the upstream beta branch's game
  PROD_SERVER: panelattack.com:49569
  UPSTREAM_REPO: https://github.com/panel-attack/panel-game.git
  UPSTREAM_REF: beta
  # If whoever deploys the beta server moves this tag in the upstream repo to
  # the deployed commit, runs use exactly that build (see the fetch step).
  UPSTREAM_DEPLOYED_TAG: betaserver-live
  UPSTREAM_BOT_REF: claude/game-bot-creation-action-0e7emk

jobs:
  bot-vs-bot:
    name: Run the bot
    runs-on: ubuntu-latest
    # A beta-server run commits a newly registered bot's account id back to
    # UPSTREAM_BOT_REF so the name can be reused (see "Save the account id").
    permissions:
      contents: write
    # Under the 6-hour hard cap so a `live` session stops on our timeout.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Install luajit + luarocks
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit luarocks liblua5.1-0-dev build-essential unzip libreadline-dev

      - name: Install lua rocks (luasocket, luafilesystem, luautf8)
        run: |
          luarocks install --local luasocket --lua-version 5.1
          luarocks install --local luafilesystem --lua-version 5.1
          luarocks install --local luautf8 --lua-version 5.1

      # The telegraph the bot is told holds only garbage still on its way (delivered transit left out).
      - name: Link checks
        run: |
          eval "$(luarocks path --local --lua-version 5.1)"
          LUA_PATH="./?.lua;./common/lib/?.lua;$LUA_PATH" LUA_CPATH="./common/lib/?.so;./common/lib/?/?.so;$LUA_CPATH" \
            luajit bot/tests/survivalLinkTelegraphVerify.lua

      # Where the bot runs and what it connects to: this checkout for this
      # repo's server; a fresh upstream checkout (next steps) for the beta one.
      - name: Pick the server
        run: |
          set -eu
          server='${{ inputs.server }}'
          if [ "$server" = "$BETA_SERVER" ] || [ "$server" = "$PROD_SERVER" ]; then
            [ '${{ inputs.mode }}' = live ] || { echo "$server is only for mode: live"; exit 1; }   # fight: the fork's client only
            dir="$GITHUB_WORKSPACE/upstream"
          else
            dir="$GITHUB_WORKSPACE"
          fi
          { echo "BOT_DIR=$dir"; echo "BOT_HOST=${server%%:*}"; echo "BOT_PORT=${server##*:}"; } >> "$GITHUB_ENV"
          echo "::notice::${{ inputs.mode }} on $server"

      # THE SERVER'S OWN BUILD, AS NEAR AS CAN BE KNOWN. Nothing of upstream is
      # vendored here: every run fetches upstream and drops this repo's bot/ on
      # top, so the bot runs the server's engine without anyone merging
      # updates. bot/ touches nothing outside itself.
      #
      # WHICH upstream: the server does not report its build (the version check
      # answers only yes/no, the login carries no commit) and upstream has no
      # deploy workflow to read it from, so, in order:
      #   1. the upstream_ref input, if given -- an exact pin;
      #   2. the UPSTREAM_DEPLOYED_TAG tag, if it exists -- moved on deploy;
      #   3. the latest UPSTREAM_REF -- right whenever the server was deployed
      #      from beta's head, which is the normal case.
      - name: Check out the upstream bot
        if: (inputs.server == env.BETA_SERVER || inputs.server == env.PROD_SERVER)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.UPSTREAM_BOT_REF }}
          path: botsrc
          sparse-checkout: bot

      - name: Fetch upstream Panel Attack and add the bot
        if: (inputs.server == env.BETA_SERVER || inputs.server == env.PROD_SERVER)
        env:
          PIN: ${{ inputs.upstream_ref }}
        run: |
          set -eu
          if [ -n "$PIN" ]; then
            ref="$PIN"; why="pinned by the upstream_ref input"
          elif [ '${{ inputs.server }}' = "$PROD_SERVER" ]; then
            ref="$UPSTREAM_REF"; why="latest $UPSTREAM_REF (the game the main server runs)"
          elif git ls-remote --exit-code --tags "$UPSTREAM_REPO" "refs/tags/$UPSTREAM_DEPLOYED_TAG" >/dev/null; then
            ref="refs/tags/$UPSTREAM_DEPLOYED_TAG"; why="the $UPSTREAM_DEPLOYED_TAG tag (the last deploy)"
          else
            ref="$UPSTREAM_REF"; why="latest $UPSTREAM_REF (no $UPSTREAM_DEPLOYED_TAG tag; assuming the server runs it)"
          fi
          git init -q upstream
          git -C upstream fetch -q --depth 1 "$UPSTREAM_REPO" "$ref"
          git -C upstream checkout -q FETCH_HEAD
          echo "::notice::bot runs on upstream $(git -C upstream log -1 --format='%h %s') -- $why"
          [ ! -e upstream/bot ] || { echo "upstream now has its own bot/ -- refusing to overwrite it"; exit 1; }
          cp -r botsrc/bot upstream/bot
          # THE LINK TO GAMECREATOR'S BOTS IS ALWAYS THIS RUN'S: the upstream-protocol bot/ is its own client, but the
          # link it hands the board through (SurvivalLink) and its test are the ones on the ref this run was dispatched
          # on, so every bot plays upstream with the link the fork's bots play with
          for f in bot/SurvivalLink.lua bot/tests/survivalLinkTelegraphVerify.lua; do
            mkdir -p "upstream/$(dirname "$f")"; cp "$f" "upstream/$f"
          done
          (cd upstream && LUA_PATH="./?.lua;./common/lib/?.lua;$(luarocks path --local --lua-version 5.1 --lr-path);;" \
             LUA_CPATH="./common/lib/?.so;./common/lib/?/?.so;$(luarocks path --local --lua-version 5.1 --lr-cpath);;" \
             luajit bot/tests/survivalLinkTelegraphVerify.lua)

      - name: Run bot-vs-bot smoke test against the live server
        if: inputs.mode == 'prod-vs'
        id: smoke
        run: |
          eval "$(luarocks path --local --lua-version 5.1)"
          set -o pipefail
          luajit bot/winRateTest.lua "" "" \
            "${{ inputs.matches }}" "$BOT_HOST" "$BOT_PORT" "${{ inputs.difficulty }}" \
            2>&1 | tee bot-prod-smoke.log
        continue-on-error: true

      # "large_garbage" training preset (TrainingMenu.lua): 6-wide x 12-tall blocks.
      # Offline harness (committed matchStart fixture, real engine) -- runs entirely
      # on the runner, does NOT contact the server. One block per volley interval
      # (900f = the preset's delayBeforeRepeat); 3600f cap = 60s survival target.
      - name: Run large-garbage practice survival (offline, real engine)
        if: inputs.mode == 'large-garbage'
        id: largegarbage
        run: |
          eval "$(luarocks path --local --lua-version 5.1)"
          set -o pipefail
          luajit bot/survivalStress.lua 900 3600 "${{ inputs.matches }}" "" "${{ inputs.difficulty }}" 6 12 \
            2>&1 | tee bot-prod-smoke.log
        continue-on-error: true

      # LIVE IS NOT THE SMOKE TEST. prod-vs logs in two throwaway accounts,
      # puts them in a PRIVATE room against each other and leaves. This logs
      # in ONE bot under a real name and keeps it up, so a human can find it
      # in the lobby and play it.
      #
      # A job is capped at 6 hours, so it is a session rather than a service:
      # re-run it, or run bot/beverly.sh on the server box under systemd for
      # something permanent.
      - name: Check the name and the weight set before connecting
        if: (inputs.mode == 'live' || inputs.mode == 'survival') && !(inputs.mode == 'live' && (inputs.server == env.BETA_SERVER || inputs.server == env.PROD_SERVER) && (inputs.bot == 'wasm' || inputs.bot == 'bitbot' || inputs.bot == 'gambit'))
        run: |
          set -eu
          cd "$BOT_DIR"
          n='${{ inputs.name }}'
          [ -n "$n" ] || { echo "name is empty"; exit 1; }
          [ ${#n} -le 16 ] || { echo "name '$n' is ${#n} chars; the server limit is 16"; exit 1; }
          if [ '${{ inputs.mode }}' = survival ]; then
            [ '${{ inputs.server }}' = fork ] || { echo "survival plays the fork's server only"; exit 1; }
            exit 0
          fi
          [ -f '${{ inputs.profile }}' ] || { echo "no weight set at ${{ inputs.profile }}"; exit 1; }
          eval "$(luarocks path --local --lua-version 5.1)"
          luajit -e 'package.path="./?.lua;"..package.path; require("bot.headlessBoot");
            local b=require("bot.WeightedBrain").new({profile="${{ inputs.profile }}"})
            print(string.format("%s loads: depth %d beam %d rise %s reaction %d",
              "${{ inputs.profile }}", b.depth, b.beam, tostring(b.rise), b.reaction))'

      # SAME NAME, SAME ACCOUNT, EVERY RUN. A runner starts with no
      # bot/identities file, so without this every dispatch registers the name
      # afresh -- and the second dispatch of a name is denied as taken. So the
      # id is not stored: it is DERIVED from the name (lowercased) and the
      # server ip, and the same name always yields the same id. The first run
      # registers the name under it (the server accepts a well-formed
      # client-supplied id for a free name); every later run logs back in.
      # Deliberately not secret: these are bot accounts, and anyone who
      # derives the id can log in as the bot, which is fine. Names registered
      # before this existed hold a random id nobody kept and cannot be reused.
      # Fork only: upstream never accepts a client-chosen id (it always assigns
      # one), so a beta bot keeps its name by saving the id it was given
      # instead -- see "Save the account id".
      - name: Derive this name's account id
        if: inputs.mode == 'live' && !(inputs.server == env.BETA_SERVER || inputs.server == env.PROD_SERVER)
        env:
          BASE_NAME: ${{ inputs.name }}
          BOT_IP: ${{ env.BOT_HOST }}
        run: |
          names="$BASE_NAME"
          mkdir -p bot/identities
          for BOT_NAME in $names; do
            id=$(BOT_NAME="$BOT_NAME" python3 -c '
          import hashlib, os
          msg = (os.environ["BOT_IP"] + "/" + os.environ["BOT_NAME"].lower()).encode()
          print("1" + str(int(hashlib.sha256(msg).hexdigest(), 16) % 10**18).zfill(18))')
            printf '%s' "$id" > "bot/identities/${BOT_NAME}_${BOT_IP}.txt"
            echo "'$BOT_NAME' logs in with account id $id (same name, same account, every run)"
          done

      # WASMSURVIVOR / BITBOT ON THE BETA SERVER (upstream Panel Attack). Same
      # bots as on the fork, from GameCreator's latest main; the client is the
      # upstream-protocol one in bot/ (branch UPSTREAM_BOT_REF), which asks them
      # for one key per frame at the one place it picks a key. BitBot's library
      # is built here from GameCreator's own native/build.sh line; WasmSurvivor
      # is a Node process beside the client (bot/SurvivalLink.lua talks to it).
      - name: Check out GameCreator (beta bot)
        if: inputs.mode == 'live' && (inputs.server == env.BETA_SERVER || inputs.server == env.PROD_SERVER) && (inputs.bot == 'wasm' || inputs.bot == 'bitbot' || inputs.bot == 'gambit')
        uses: actions/checkout@v4
        with:
          repository: briankeegan/GameCreator
          path: GameCreator
          sparse-checkout: games/the-game

      - uses: actions/setup-node@v4
        if: inputs.mode == 'live' && (inputs.server == env.BETA_SERVER || inputs.server == env.PROD_SERVER) && (inputs.bot == 'wasm' || inputs.bot == 'bitbot' || inputs.bot == 'gambit')
        with:
          node-version: '22'

      - name: Sit in the lobby (beta, ${{ inputs.bot }})
        if: inputs.mode == 'live' && (inputs.server == env.BETA_SERVER || inputs.server == env.PROD_SERVER) && (inputs.bot == 'wasm' || inputs.bot == 'bitbot' || inputs.bot == 'gambit')
        id: betalink
        run: |
          set -eu
          eval "$(luarocks path --local --lua-version 5.1)"
          export GC_EVAL_DIR="$GITHUB_WORKSPACE/GameCreator/games/the-game/ai/eval"
          # name is "BOT" or "BOT,OPPONENT": the second half is a lobby name this bot challenges
          name='${{ inputs.name }}'
          # "BOT,OPPONENT" or "BOT,OPPONENT,GAMES": after GAMES finished games against OPPONENT the bot stops challenging
          # and sits in the lobby accepting whoever challenges
          games=""
          case "$name" in *,*) target=${name#*,}; name=${name%%,*};; *) target="";; esac
          case "$target" in *,*) games=${target#*,}; target=${target%%,*};; esac
          [ -n "$name" ] && [ ${#name} -le 16 ] || { echo "name '$name' must be 1-16 characters"; exit 1; }
          echo "::notice::GameCreator at $(git -C "$GC_EVAL_DIR" log -1 --format='%h %s' | cut -c1-120)"
          kind='${{ inputs.bot }}'
          if [ "$kind" = bitbot ]; then
            line=$(grep -E '^clang .* -shared .*libbit\.so' "$GC_EVAL_DIR/native/build.sh" | head -1)
            (cd "$GC_EVAL_DIR/native" && eval "$line") 2> bitbot-build.log || { cat bitbot-build.log; echo "libbit.so did not build"; exit 1; }
            brain=bitbot
          elif [ "$kind" = gambit ]; then
            # GameCreator's Gambit (C, libgambit.so), built here and played in the client's own process
            # (gambit/lua/GambitNative.lua). Its profile is a path under the eval dir, as numbers (words.js).
            G="$GC_EVAL_DIR/../gambit"
            gp=survivor-profiles/gambit.json
            case '${{ inputs.profile }}' in survivor-profiles/*) gp='${{ inputs.profile }}';; esac
            [ -f "$GC_EVAL_DIR/$gp" ] || { echo "no Gambit profile $GC_EVAL_DIR/$gp"; exit 1; }
            sh "$G/build.sh" native > gambit-build.log 2>&1 || { cat gambit-build.log; echo "libgambit.so did not build"; exit 1; }
            GC_SURVIVOR_PROFILE="$GC_EVAL_DIR/$gp" node "$G/words.js" > "$PWD/gambit.words" 2>> gambit-build.log || { cat gambit-build.log; echo "Gambit's profile did not encode"; exit 1; }
            echo "::notice::Gambit built from GameCreator $(git -C "$GC_EVAL_DIR" log -1 --format=%h), profile $gp"
            export GC_GAMBIT_WORDS="$PWD/gambit.words" GC_GAMBIT_LOG="$PWD/gambit-$name.log"
            brain=gambit
          else
            prof='${{ inputs.profile }}'
            prof_abs=""
            case "$prof" in
              *.wasm.json)
                [ -f "$prof" ] || { echo "no WasmSurvivor profile $prof"; exit 1; }
                w=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["weights"])' "$prof")
                cp "$(dirname "$prof")/$w" "$GC_EVAL_DIR/$w"
                prof_abs="$PWD/$prof"; echo "WasmSurvivor plays $prof" ;;
              *) echo "profile '$prof' is not a *.wasm.json: WasmSurvivor plays its default" ;;
            esac
            GC_SURVIVOR_PROFILE="$prof_abs" GC_SURVIVOR_KEEP=4 nohup node "$GC_EVAL_DIR/survivor.js" --port 47777 > "mind-$name.log" 2>&1 &
            for i in $(seq 1 300); do grep -q listening "mind-$name.log" && break; sleep 0.2; done
            grep -q listening "mind-$name.log" || { cat "mind-$name.log"; echo "WasmSurvivor did not start"; exit 1; }
            export PA_SURVIVOR_PORT=47777
            brain=survival
          fi
          # The defensive (default-profile) WasmSurvivor does not take time-attack challenges; the others do.
          # Gambit with a target fights ONLY that player: it answers no one else's challenge
          only=""; [ "$kind" = gambit ] && only="$target"
          decline=""; if [ "$kind" = wasm ]; then case "${prof:-}" in *.wasm.json) ;; *) decline=TWO_PLAYER_TIME_ATTACK ;; esac; fi
          cd "$BOT_DIR"
          # The server hands a new name its account id at the first login. Save it to the bot branch the
          # moment it is written, not only when the run ends: a run that dies would lose it.
          (
            f="bot/identities/${name}_${BOT_HOST}.txt"
            for i in $(seq 1 90); do
              if [ -s "$BOT_DIR/$f" ]; then
                mkdir -p "$GITHUB_WORKSPACE/botsrc/bot/identities"
                cp "$BOT_DIR/$f" "$GITHUB_WORKSPACE/botsrc/$f"
                cd "$GITHUB_WORKSPACE/botsrc"
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git add "$f"
                if git diff --cached --quiet; then echo "account id already saved"; else
                  git commit -q -m "bot: save account id for '$name' on $BOT_HOST"
                  for k in 1 2 3; do git push -q origin "HEAD:$UPSTREAM_BOT_REF" && echo "account id saved" && break; git pull -q --rebase origin "$UPSTREAM_BOT_REF"; done
                fi
                break
              fi
              sleep 2
            done
          ) > "$GITHUB_WORKSPACE/save-id-$name.log" 2>&1 &
          secs=$(( ${{ inputs.hours }} * 3600 ))
          echo "::notice::$name ($brain) joining $BOT_HOST:$BOT_PORT for ${{ inputs.hours }}h"
          set -o pipefail
          PA_CHALLENGE="$target" PA_CHALLENGE_GAMES="$games" PA_ACCEPT_ONLY="$only" PA_DECLINE_MODES="$decline" timeout "$secs" luajit bot/playBot.lua "$BOT_HOST" "$BOT_PORT" "$name" 4 12 "$brain" \
            2>&1 | tee "$GITHUB_WORKSPACE/bot-prod-smoke.log" || [ $? -eq 124 ]

      - name: Sit in the lobby
        if: inputs.mode == 'live' && !(inputs.mode == 'live' && (inputs.server == env.BETA_SERVER || inputs.server == env.PROD_SERVER) && (inputs.bot == 'wasm' || inputs.bot == 'bitbot' || inputs.bot == 'gambit'))
        id: live
        env:
          PA_SEARCH_PROFILE: ${{ inputs.profile }}
        run: |
          eval "$(luarocks path --local --lua-version 5.1)"
          secs=$(( ${{ inputs.hours }} * 3600 ))
          echo "::notice::${{ inputs.name }} joining $BOT_HOST:$BOT_PORT for ${{ inputs.hours }}h"
          cd "$BOT_DIR"
          set -o pipefail
          # The bot runs until killed, so the timeout IS the stop condition:
          # 124 from `timeout` is this working, not failing.
          timeout "$secs" bot/plamp.sh "$BOT_HOST" "$BOT_PORT" '${{ inputs.name }}' \
            2>&1 | tee "$GITHUB_WORKSPACE/bot-prod-smoke.log" || [ $? -eq 124 ]

      # WASMSURVIVOR. The survival bot is GameCreator's (survivor.js): it
      # plans on this server's own rules (its pa-engine.js / native/pa.c are
      # held to this repo's Lua engine frame by frame) and tells the client
      # what to press every frame through bot/SurvivalLink.lua. It runs beside
      # the client on this runner, on the cores the client does not use.
      - name: Check out WasmSurvivor
        if: inputs.mode == 'survival'
        uses: actions/checkout@v4
        with:
          repository: briankeegan/GameCreator
          path: GameCreator
          sparse-checkout: games/the-game

      - uses: actions/setup-node@v4
        if: inputs.mode == 'survival'
        with:
          node-version: '22'

      - name: Start WasmSurvivor
        if: inputs.mode == 'survival'
        run: |
          set -eu
          nohup node GameCreator/games/the-game/ai/eval/survivor.js --port 47777 > "$GITHUB_WORKSPACE/survivor.log" 2>&1 &
          for i in $(seq 1 300); do grep -q listening "$GITHUB_WORKSPACE/survivor.log" && break; sleep 0.2; done
          cat "$GITHUB_WORKSPACE/survivor.log"
          grep -q listening "$GITHUB_WORKSPACE/survivor.log" || { echo "WasmSurvivor did not start"; exit 1; }

      - name: Sit in the lobby (WasmSurvivor)
        if: inputs.mode == 'survival'
        id: survival
        env:
          PA_SURVIVOR_PORT: '47777'
        run: |
          eval "$(luarocks path --local --lua-version 5.1)"
          secs=$(( ${{ inputs.hours }} * 3600 ))
          echo "::notice::${{ inputs.name }} (WasmSurvivor) joining $BOT_HOST:$BOT_PORT for ${{ inputs.hours }}h"
          set -o pipefail
          timeout "$secs" luajit bot/playBot.lua "$BOT_HOST" "$BOT_PORT" '${{ inputs.name }}' 4 12 survival \
            2>&1 | tee "$GITHUB_WORKSPACE/bot-prod-smoke.log" || [ $? -eq 124 ]

      # SAME NAME, SAME ACCOUNT on beta. Upstream hands a new name a random id
      # at its first login; the bot writes it to bot/identities/, and this
      # commits it to UPSTREAM_BOT_REF so the next run logs back in instead of
      # being denied as "already taken". Not secret, on purpose: bot accounts.
      - name: Save the account id
        if: always() && (inputs.server == env.BETA_SERVER || inputs.server == env.PROD_SERVER)
        run: |
          set -eu
          n='${{ inputs.name }}'; n=${n%%,*}   # (a "BOT,OPPONENT" name: the account is the bot's)
          f="bot/identities/${n}_${BOT_HOST}.txt"
          [ -f "upstream/$f" ] || { echo "no id to save"; exit 0; }
          if [ -f "botsrc/$f" ] && cmp -s "upstream/$f" "botsrc/$f"; then echo "id already saved"; exit 0; fi
          mkdir -p "botsrc/bot/identities"
          cp "upstream/$f" "botsrc/$f"
          cd botsrc
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$f"
          git commit -m "bot: save account id for '${{ inputs.name }}' on $BOT_HOST"
          for i in 1 2 3; do
            git push origin "HEAD:$UPSTREAM_BOT_REF" && exit 0
            git pull --rebase origin "$UPSTREAM_BOT_REF"
          done
          exit 1

      # BITBOT and WASMSURVIVOR come from GameCreator's latest main. BitBot is
      # C: fight.sh builds its libbit.so (the line in GameCreator's
      # native/build.sh) and the client plays it in-process
      # (bot/BitBotNative.lua, as GameCreator's lua/train.lua does).
      - name: Check out GameCreator (BitBot, WasmSurvivor)
        if: inputs.mode == 'fight' && (contains(fromJSON('["bitbot","bitbotwasm","wasm","gambit"]'), inputs.bot) || contains(fromJSON('["bitbot","bitbotwasm","wasm","gambit"]'), inputs.opponent))
        uses: actions/checkout@v4
        with:
          repository: briankeegan/GameCreator
          path: GameCreator
          sparse-checkout: games/the-game

      - name: The Gambit of another GameCreator commit
        if: inputs.mode == 'fight' && inputs.gambit_from != ''
        env:
          GAMBIT_FROM: ${{ inputs.gambit_from }}
        run: |
          cd GameCreator
          from=$(awk -v n="$GAMBIT_FROM" '$1 == n { print $2 }' games/the-game/ai/eval/gambit-versions.txt 2>/dev/null); from=${from:-$GAMBIT_FROM}
          git fetch -q --depth 1 origin "$from"
          rm -rf games/the-game/ai/gambit && git checkout FETCH_HEAD -- games/the-game/ai/gambit
          echo "::notice::Gambit of GameCreator $GAMBIT_FROM ($from)"

      - uses: actions/setup-node@v4
        if: inputs.mode == 'fight' && (contains(fromJSON('["bitbot","bitbotwasm","wasm","gambit"]'), inputs.bot) || contains(fromJSON('["bitbot","bitbotwasm","wasm","gambit"]'), inputs.opponent))
        with:
          node-version: '22'

      # FIGHT: bot/fight.sh does it all -- accounts, BitBot's link and its
      # pre-flight when BitBot plays (nothing joins the lobby if that fails),
      # then `bot` in the lobby and `opponent` challenging it.
      - name: Fight
        if: inputs.mode == 'fight'
        id: fight
        env:
          GC_EVAL_DIR: ${{ github.workspace }}/GameCreator/games/the-game/ai/eval
          WASM_PROFILE: ${{ inputs.profile }}
        run: |
          eval "$(luarocks path --local --lua-version 5.1)"
          [ "${BOT_HOST}:${BOT_PORT}" != "$BETA_SERVER" ] && [ "${BOT_HOST}:${BOT_PORT}" != "$PROD_SERVER" ] || { echo "fight plays the fork's server only"; exit 1; }
          if [ -d GameCreator ]; then echo "::notice::GameCreator $(git -C GameCreator log -1 --format='%h %s')"; fi
          echo "::notice::${{ inputs.name }} (${{ inputs.bot }}) vs ${{ inputs.opponent }} on $BOT_HOST:$BOT_PORT for ${{ inputs.hours }}h"
          set -o pipefail
          bot/fight.sh "$BOT_HOST" "$BOT_PORT" $(( ${{ inputs.hours }} * 3600 )) '${{ inputs.bot }}' '${{ inputs.name }}' '${{ inputs.opponent }}' \
            2>&1 | tee bot-prod-smoke.log

      # A new name's account id, made by the server at its first login, is
      # committed back to the branch this ran from, so the next run logs back
      # in as the same account (fight.sh reads bot/identities/). Runs on
      # cancel too: an id is saved however the run ends.
      - name: Save new account ids
        if: always() && inputs.mode == 'fight'
        run: |
          set -u
          added=""
          for f in bot/identities/*_"$BOT_HOST".txt; do
            [ -s "$f" ] || continue
            git ls-files --error-unmatch "$f" >/dev/null 2>&1 && continue
            git add -f "$f" && added="$added $(basename "$f" "_$BOT_HOST.txt")"
          done
          [ -n "$added" ] || { echo "no new account ids"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "bot: save account ids for$added on $BOT_HOST"
          for i in 1 2 3 4; do
            git push origin "HEAD:refs/heads/${{ github.ref_name }}" && { echo "saved:$added"; exit 0; }
            git pull --rebase origin "${{ github.ref_name }}"
          done
          echo "::error::could not save account ids for$added"; exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "## Bot (${{ inputs.mode }}) — ${{ inputs.server }}"
            echo ""
            echo '```'
            tail -n 40 bot-prod-smoke.log || echo "(no log produced)"
            echo '```'
            for f in bitbot-mind.log mind-*.log; do [ -f "$f" ] || continue; echo "### $f"; echo '```'; tail -n 40 "$f"; echo '```'; done
            if [ -f GameCreator/games/the-game/ai/eval/survivor_runsummary.js ] && ls fight-*.log >/dev/null 2>&1; then
              echo "## The run's own report"
              node GameCreator/games/the-game/ai/eval/survivor_runsummary.js . 2>&1 | tail -n 30 || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-prod-smoke-log
          path: |
            bot-prod-smoke.log
            bitbot-mind.log
            bitbot-preflight.log
            mind-*.log
            preflight-*.log
            save-id-*.log
            fight-*.log
            gambit-*.log
            death-*.jsonl.gz
            frames-*.jsonl.gz

      - name: Fail if the run failed
        if: steps.smoke.outcome == 'failure' || steps.largegarbage.outcome == 'failure' || steps.live.outcome == 'failure' || steps.fight.outcome == 'failure'
        run: exit 1
