name: Bot Prod Smoke Test (LIVE SERVER)

# Manual-only. Connects to the REAL self-hosted production server (default
# 104.156.250.136:49569) with two throwaway bot accounts that create a PRIVATE
# room and challenge only each other -- never the public lobby queue, never
# ranked (BotClient never sets wantsRanked) -- so no real player can ever be
# matched with them and the leaderboard is never touched. Runs at real 60Hz
# pace (no PA_FAST), same load profile as one human playing one bot.
#
# This is a connectivity/regression smoke test (does the bot still log in,
# join a room, and finish a match against the deployed server?), not a
# benchmark -- see bot/BENCHMARK.md for the seed-averaged ceiling numbers,
# which are measured locally.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to run'
        required: false
        default: 'prod-vs'
        type: choice
        options:
          - prod-vs          # bot-vs-bot matches on the live server
          - large-garbage    # offline survival vs the "large_garbage" training preset (6x12 blocks); no server contact
          - lobby            # park ONE bot in the live lobby so a human can challenge it
      matches:
        description: 'prod-vs: number of matches (~2.5 min worst-case each). large-garbage: number of seeds.'
        required: false
        default: '3'
      ip:
        description: 'Server IP'
        required: false
        default: '104.156.250.136'
      port:
        description: 'Server port'
        required: false
        default: '49569'
      difficulty:
        description: 'Bot difficulty/level (1-10ish)'
        required: false
        default: 'hard'
      bot_name:
        description: 'lobby: name in the lobby. The run number is appended so it is unique; 16 chars total is the server limit.'
        required: false
        default: 'Swapsy'
      brain:
        description: 'lobby: which brain. weighted = the trained evaluator; heuristic = the shape-catalog bot.'
        required: false
        default: 'weighted'
        type: choice
        options:
          - weighted
          - heuristic
      minutes:
        description: 'lobby: how long to stay in the lobby before the bot leaves.'
        required: false
        default: '120'
      exact_name:
        description: 'lobby: use bot_name verbatim instead of appending the run number. The name must then be one the server has never seen, or login is denied.'
        required: false
        default: ''

jobs:
  bot-vs-bot:
    name: Bot vs bot on live server
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install luajit + luarocks
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit luarocks liblua5.1-0-dev build-essential unzip libreadline-dev

      - name: Install lua rocks (luasocket, luafilesystem, luautf8)
        run: |
          luarocks install --local luasocket --lua-version 5.1
          luarocks install --local luafilesystem --lua-version 5.1
          luarocks install --local luautf8 --lua-version 5.1

      - name: Run bot-vs-bot smoke test against the live server
        if: inputs.mode == 'prod-vs'
        id: smoke
        run: |
          eval "$(luarocks path --local --lua-version 5.1)"
          set -o pipefail
          luajit bot/winRateTest.lua "" "" \
            "${{ inputs.matches }}" "${{ inputs.ip }}" "${{ inputs.port }}" "${{ inputs.difficulty }}" \
            2>&1 | tee bot-prod-smoke.log
        continue-on-error: true

      # "large_garbage" training preset (TrainingMenu.lua): 6-wide x 12-tall blocks.
      # Offline harness (committed matchStart fixture, real engine) -- runs entirely
      # on the runner, does NOT contact the server. One block per volley interval
      # (900f = the preset's delayBeforeRepeat); 3600f cap = 60s survival target.
      - name: Run large-garbage practice survival (offline, real engine)
        if: inputs.mode == 'large-garbage'
        id: largegarbage
        run: |
          eval "$(luarocks path --local --lua-version 5.1)"
          set -o pipefail
          luajit bot/survivalStress.lua 900 3600 "${{ inputs.matches }}" "" "${{ inputs.difficulty }}" 6 12 \
            2>&1 | tee bot-prod-smoke.log
        continue-on-error: true

      - name: Summary
        if: always()
        run: |
          {
            echo "## Bot Smoke Test (${{ inputs.mode }}) — ${{ inputs.ip }}:${{ inputs.port }}"
            echo ""
            echo '```'
            tail -n 40 bot-prod-smoke.log || echo "(no log produced)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-prod-smoke-log
          path: bot-prod-smoke.log

      - name: Fail if the smoke test failed
        if: steps.smoke.outcome == 'failure' || steps.largegarbage.outcome == 'failure'
        run: exit 1

  # PARK A BOT IN THE LIVE LOBBY SO A HUMAN CAN PLAY IT.
  #
  # This exists because a GitHub runner can reach the server and a cloud dev
  # sandbox cannot — the sandbox only has an HTTPS proxy outbound, so raw TCP
  # on 49569 times out. The runner is the deploy path, and the same one the
  # prod-vs mode above already uses.
  #
  # playBot.lua idles in the lobby and AUTO-ACCEPTS any challenge, rematching
  # until it is stopped. It is bounded by `timeout` rather than left to the job
  # limit so the bot leaves on a schedule you chose instead of whenever the
  # runner gives out.
  #
  # THE NAME GETS THE RUN NUMBER APPENDED, AND THAT IS NOT DECORATION. The
  # bot's account id is persisted to servers/<ip>/user_id.txt, which is
  # gitignored — so every fresh runner has no identity and REGISTERS the name
  # from scratch. Dispatch twice with the same fixed name and the second login
  # is denied by the server's name-already-taken guard, and playBot exits with
  # "login failed" having done nothing. The run number makes each dispatch a
  # new account. Truncated to the server's 16-character limit.
  lobby:
    name: Park a bot in the live lobby
    if: inputs.mode == 'lobby'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Install luajit + luarocks
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit luarocks liblua5.1-0-dev build-essential unzip libreadline-dev

      - name: Install lua rocks (luasocket, luafilesystem, luautf8)
        run: |
          luarocks install --local luasocket --lua-version 5.1
          luarocks install --local luafilesystem --lua-version 5.1
          luarocks install --local luautf8 --lua-version 5.1

      - name: Say what to look for in the lobby
        id: whoami
        run: |
          # The run number is appended so each dispatch registers a NEW
          # account — see the note above the job. exact_name opts out when a
          # specific name is wanted; that name then has to be one the server
          # has never seen, because a fresh runner re-registers it from
          # scratch and the server denies a name already taken.
          if [ -n "${{ inputs.exact_name }}" ]; then
            name="${{ inputs.bot_name }}"
          else
            name="${{ inputs.bot_name }}${{ github.run_number }}"
          fi
          name="${name:0:16}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          {
            echo "## Challenge \`$name\` in the lobby"
            echo ""
            echo "- server: ${{ inputs.ip }}:${{ inputs.port }}"
            echo "- brain: ${{ inputs.brain }}"
            echo "- staying for ${{ inputs.minutes }} minutes, then it leaves"
            echo ""
            echo "It auto-accepts any challenge and rematches until it goes."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sit in the lobby
        env:
          # The trained weight set. Ignored unless brain == weighted.
          PA_SEARCH_PROFILE: bot/profiles/trained.json
        run: |
          eval "$(luarocks path --local --lua-version 5.1)"
          set -o pipefail
          # timeout exits 124 when it does its job, which is the expected
          # ending here, not a failure.
          timeout "${{ inputs.minutes }}m" \
            luajit bot/playBot.lua "${{ inputs.ip }}" "${{ inputs.port }}" \
              "${{ steps.whoami.outputs.name }}" "" "" "${{ inputs.brain }}" \
            2>&1 | tee bot-lobby.log || [ $? -eq 124 ]

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-lobby-log
          path: bot-lobby.log
