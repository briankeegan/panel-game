# with every event counted. Runs only on this project's branch and only when chaos-bot/ changes; shares nothing with Gambit's
# workflows (own name, own concurrency group, own artifact names).
name: chaos-bot checks
on:
  push:
    branches: [ccr-9ee25bfb-744765]
    # (only the engine and the recorder it is held to: an ordinary push -- a bot change, the request -- starts no job beside the games,
    # which are kept to 8 at a time, the owner's limit)
    paths: ['chaos-bot/engine/**', 'chaos-bot/lua/**', '.github/workflows/chaos-bot-checks.yml']
concurrency:
  group: chaos-bot-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    name: engine vs chaos Lua
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install luajit
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Checks
        run: |
          set -o pipefail
          chaos-bot/engine/checks.sh 300 | tee chaos-bot-checks.txt
      - name: Upload the counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-bot-checks
          path: chaos-bot-checks.txt
