# The chaos bot's games (chaos-bot/plans/chaos-goal.md §2): one job a game in the real chaos v3 client, headless, then a report.
# Started only by a push to this project's branch that changes chaos-bot/bench/request.txt (the games to play, one a line), so a
# run is always asked for on purpose. Shares nothing with Gambit's workflows: its own name, concurrency group, artifact names, cache key.
# It does not wait for Gambit's benchmark (the owner, 2026-11-25: "you don't have to pay attention to Gambit's benchmark").
name: chaos-bot games
on:
  push:
    branches: [ccr-9ee25bfb-744765]
    paths: ['chaos-bot/bench/request.txt']
concurrency:
  group: chaos-bot-games
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      games: ${{ steps.games.outputs.games }}
    steps:
      - uses: actions/checkout@v4
      - id: games
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          games = []
          for line in open("chaos-bot/bench/request.txt"):
              f = line.split()
              if not f or f[0].startswith("#"): continue
              p, seed, gl, gs, q, frames = f[:6]
              level = int(f[6]) if len(f) > 6 and "=" not in f[6] else 9
              # the chaos settings after the level, as key=value: mode (1 normal, 2 one HP, 3 no stop time, 4 BALL), margin
              # (1 off, 2 colors, 3 modoki, 4 chaos), chaosmode (0/1), colors, profile (profiles/<name>.words; default chaos)
              kv = dict(x.split("=", 1) for x in f[6:] if "=" in x)
              games.append({"pattern": p, "seed": int(seed), "glevel": int(gl), "gspeed": int(gs), "queue": int(q), "frames": int(frames), "level": level,
                            "mode": int(kv.get("mode", 1)), "margin": int(kv.get("margin", 1)), "chaosmode": int(kv.get("chaosmode", 0)), "colors": int(kv.get("colors", 6)), "challenge": kv.get("challenge", ""), "profile": kv.get("profile", "chaos"),
                            "n": len(games) + 1})
          assert games, "no games in request.txt"
          print("games=" + json.dumps(games))
          PY
  play1:
    needs: [plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        game: ${{ fromJSON(needs.plan.outputs.games) }}
    name: try 1 game ${{ matrix.game.n }} L${{ matrix.game.level }} ${{ matrix.game.pattern }} seed ${{ matrix.game.seed }} mode ${{ matrix.game.mode }} margin ${{ matrix.game.margin }} chaos ${{ matrix.game.chaosmode }} colors ${{ matrix.game.colors }} challenge ${{ matrix.game.challenge }} ${{ matrix.game.profile }}
    steps:
      - id: gate
        # (THE RUNNER CHOSEN, BY MODEL -- the owner, 2026-11-27: "if we get a bad runner... we just skip it.... and wait for another";
        # "Skip by model, not by vendor". Gambit-24's 43 runs (#4799-#4848), each model's loss rate against its own runs': Xeon Platinum
        # 8573C 1.73 (the worst), EPYC 7763 1.46, EPYC 9V74 1.33, Xeon 6975P-C 0.78, EPYC 9V45 0.56 (the best). A game that lands on one of
        # the three worst models is not played here and waits for the next attempt's runner; the last attempt plays on whatever it draws.
        # A model not named is played. A game already played in an earlier attempt -- its artifact is in the run -- is not played again.)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=${{ matrix.game.n }}; attempt=1; last=4
          names=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" | python3 -c "import json,sys; print(' '.join(a['name'] for a in json.load(sys.stdin).get('artifacts', [])))")
          if echo " $names " | grep -q " chaosbot-game-$n "; then echo "go=false" >> "$GITHUB_OUTPUT"; echo "game $n: played already"; exit 0; fi
          model=$(lscpu | sed -n 's/^Model name: *//p' | head -1)
          # (the model NUMBER, never a vendor or brand word: "Platinum" would skip the 8370C too, which lost 0 of 24 -- the owner)
          if [ "$attempt" -lt "$last" ] && echo "$model" | grep -Eqi '8573C|7763|9V74'; then
            echo "go=false" >> "$GITHUB_OUTPUT"; echo "skipped runner: $model" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=game $n::skipped runner: $model (try $attempt; the game waits for the next try's runner)"; exit 0
          fi
          echo "$model | $(nproc) cpus | $(sed -n 's/^cpu MHz.*: *//p' /proc/cpuinfo | head -1) MHz" > "$RUNNER_TEMP/cpu.txt"   # (checkout cleans the workspace: the Play step copies it into out/)
          echo "go=true" >> "$GITHUB_OUTPUT"; echo "game $n: try $attempt plays on $model"
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
      - name: love, cached
        if: steps.gate.outputs.go == 'true'
        uses: actions/cache@v4
        with:
          path: /tmp/love.tar.gz
          key: chaosbot-love-12.0-linux-x86_64
      - name: chaos client, cached
        if: steps.gate.outputs.go == 'true'
        # (the pinned client zip kept between runs -- run 187 lost 7 of 8 games twice to its download answering 504)
        uses: actions/cache@v4
        with:
          path: /tmp/chaosbot-zip
          key: chaosbot-client-test-build-v3-ec5baf00
      - name: xvfb, love, clang
        if: steps.gate.outputs.go == 'true'
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120"
          for i in 1 2 3; do timeout 240 sudo apt-get $APT update && timeout 240 sudo apt-get $APT install -y libfuse2 xvfb clang && break; sleep 10; done
          mkdir -p ~/love2d
          [ -s /tmp/love.tar.gz ] || for i in 1 2 3 4 5 6; do curl -fsSL "https://github.com/panel-attack/panel-game/releases/download/love2d-12.0/love-12.0-linux-x86_64.tar.gz" -o /tmp/love.tar.gz && break; sleep $((i * 15)); done
          tar -xzf /tmp/love.tar.gz -C ~/love2d
          mv ~/love2d/*.AppImage ~/love2d/love.AppImage
          chmod +x ~/love2d/love.AppImage
      - name: Play
        if: steps.gate.outputs.go == 'true'
        env:
          LOVE: /home/runner/love2d/love.AppImage
          CHAOSBOT_LEVEL: ${{ matrix.game.level }}
          CHAOSBOT_GAMEMODE: ${{ matrix.game.mode }}
          CHAOSBOT_MARGIN: ${{ matrix.game.margin }}
          CHAOSBOT_CHAOSMODE: ${{ matrix.game.chaosmode }}
          CHAOSBOT_COLORS: ${{ matrix.game.colors }}
          CHAOSBOT_CHALLENGE: ${{ matrix.game.challenge }}
          CHAOSBOT_PROFILE: ${{ matrix.game.profile }}
          CHAOSBOT_ZIP_CACHE: /tmp/chaosbot-zip
        run: |
          g='${{ toJSON(matrix.game) }}'
          mkdir -p out && cp "$RUNNER_TEMP/cpu.txt" out/cpu.txt
          bash chaos-bot/bench/play.sh ${{ matrix.game.pattern }} ${{ matrix.game.seed }} ${{ matrix.game.glevel }} ${{ matrix.game.gspeed }} ${{ matrix.game.queue }} ${{ matrix.game.frames }} out
          echo "::notice title=game ${{ matrix.game.n }}::$(cat out/result.txt)"
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.go == 'true' && (always())
        with:
          name: chaosbot-game-${{ matrix.game.n }}
          path: out/
          if-no-files-found: warn
          retention-days: 14
