  g8t4:
    needs: [plan, g8t3]
    if: always() && needs.plan.result == 'success' && fromJSON(needs.plan.outputs.count) >= 8
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: try 4 game ${{ fromJSON(needs.plan.outputs.games)[7].n }} L${{ fromJSON(needs.plan.outputs.games)[7].level }} ${{ fromJSON(needs.plan.outputs.games)[7].pattern }} seed ${{ fromJSON(needs.plan.outputs.games)[7].seed }} mode ${{ fromJSON(needs.plan.outputs.games)[7].mode }} margin ${{ fromJSON(needs.plan.outputs.games)[7].margin }} chaos ${{ fromJSON(needs.plan.outputs.games)[7].chaosmode }} colors ${{ fromJSON(needs.plan.outputs.games)[7].colors }} challenge ${{ fromJSON(needs.plan.outputs.games)[7].challenge }} ${{ fromJSON(needs.plan.outputs.games)[7].profile }}
    steps:
      - id: gate
        # (THE RUNNER CHOSEN, BY MODEL -- the owner, 2026-11-27: "if we get a bad runner... we just skip it.... and wait for another";
        # "Skip by model, not by vendor". Gambit-24's 43 runs (#4799-#4848), each model's loss rate against its own runs': Xeon Platinum
        # 8573C 1.73 (the worst), EPYC 7763 1.46, EPYC 9V74 1.33, Xeon 6975P-C 0.78, EPYC 9V45 0.56 (the best). A game that lands on one of
        # the three worst models is not played here and waits for the next attempt's runner; the last attempt plays on whatever it draws.
        # A model not named is played. A game already played in an earlier attempt -- its artifact is in the run -- is not played again.
        # Each game's tries are their own chain (gNt1-gNt4): a skipped try's next one starts at once, never waiting on the other games --
        # the owner, 22:12 ET: "it should just immediately stop and restart the next one")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=${{ fromJSON(needs.plan.outputs.games)[7].n }}; attempt=4; last=4
          names=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" | python3 -c "import json,sys; print(' '.join(a['name'] for a in json.load(sys.stdin).get('artifacts', [])))")
          if echo " $names " | grep -q " chaosbot-game-$n "; then echo "go=false" >> "$GITHUB_OUTPUT"; echo "game $n: played already"; exit 0; fi
          model=$(lscpu | sed -n 's/^Model name: *//p' | head -1)
          # (the model NUMBER, never a vendor or brand word: "Platinum" would skip the 8370C too, which lost 0 of 24 -- the owner)
          if [ "$attempt" -lt "$last" ] && echo "$model" | grep -Eqi '8573C|7763|9V74'; then
            echo "go=false" >> "$GITHUB_OUTPUT"; echo "skipped runner: $model" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=game $n::skipped runner: $model (try $attempt; the game waits for the next try's runner)"; exit 0
          fi
          echo "$model | $(nproc) cpus | $(sed -n 's/^cpu MHz.*: *//p' /proc/cpuinfo | head -1) MHz" > "$RUNNER_TEMP/cpu.txt"   # (checkout cleans the workspace: the Play step copies it into out/)
          echo "go=true" >> "$GITHUB_OUTPUT"; echo "game $n: try $attempt plays on $model"
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
      - name: love, cached
        if: steps.gate.outputs.go == 'true'
        uses: actions/cache@v4
        with:
          path: /tmp/love.tar.gz
          key: chaosbot-love-12.0-linux-x86_64
      - name: chaos client, cached
        if: steps.gate.outputs.go == 'true'
        # (the pinned client zip kept between runs -- run 187 lost 7 of 8 games twice to its download answering 504)
        uses: actions/cache@v4
        with:
          path: /tmp/chaosbot-zip
          key: chaosbot-client-test-build-v3-ec5baf00
      - name: xvfb, love, clang
        if: steps.gate.outputs.go == 'true'
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120"
          for i in 1 2 3; do timeout 240 sudo apt-get $APT update && timeout 240 sudo apt-get $APT install -y libfuse2 xvfb clang && break; sleep 10; done
          mkdir -p ~/love2d
          [ -s /tmp/love.tar.gz ] || for i in 1 2 3 4 5 6; do curl -fsSL "https://github.com/panel-attack/panel-game/releases/download/love2d-12.0/love-12.0-linux-x86_64.tar.gz" -o /tmp/love.tar.gz && break; sleep $((i * 15)); done
          tar -xzf /tmp/love.tar.gz -C ~/love2d
          mv ~/love2d/*.AppImage ~/love2d/love.AppImage
          chmod +x ~/love2d/love.AppImage
      - name: Play
        if: steps.gate.outputs.go == 'true'
        env:
          LOVE: /home/runner/love2d/love.AppImage
          CHAOSBOT_LEVEL: ${{ fromJSON(needs.plan.outputs.games)[7].level }}
          CHAOSBOT_GAMEMODE: ${{ fromJSON(needs.plan.outputs.games)[7].mode }}
          CHAOSBOT_MARGIN: ${{ fromJSON(needs.plan.outputs.games)[7].margin }}
          CHAOSBOT_CHAOSMODE: ${{ fromJSON(needs.plan.outputs.games)[7].chaosmode }}
          CHAOSBOT_COLORS: ${{ fromJSON(needs.plan.outputs.games)[7].colors }}
          CHAOSBOT_CHALLENGE: ${{ fromJSON(needs.plan.outputs.games)[7].challenge }}
          CHAOSBOT_PROFILE: ${{ fromJSON(needs.plan.outputs.games)[7].profile }}
          CHAOSBOT_ZIP_CACHE: /tmp/chaosbot-zip
        run: |
          g='${{ toJSON(fromJSON(needs.plan.outputs.games)[7]) }}'
          mkdir -p out && cp "$RUNNER_TEMP/cpu.txt" out/cpu.txt
          bash chaos-bot/bench/play.sh ${{ fromJSON(needs.plan.outputs.games)[7].pattern }} ${{ fromJSON(needs.plan.outputs.games)[7].seed }} ${{ fromJSON(needs.plan.outputs.games)[7].glevel }} ${{ fromJSON(needs.plan.outputs.games)[7].gspeed }} ${{ fromJSON(needs.plan.outputs.games)[7].queue }} ${{ fromJSON(needs.plan.outputs.games)[7].frames }} out
          echo "::notice title=game ${{ fromJSON(needs.plan.outputs.games)[7].n }}::$(cat out/result.txt)"
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.go == 'true' && (always())
        with:
          name: chaosbot-game-${{ fromJSON(needs.plan.outputs.games)[7].n }}
          path: out/
          if-no-files-found: warn
          retention-days: 14
  report:
    needs: [plan, g1t1, g1t2, g1t3, g1t4, g2t1, g2t2, g2t3, g2t4, g3t1, g3t2, g3t3, g3t4, g4t1, g4t2, g4t3, g4t4, g5t1, g5t2, g5t3, g5t4, g6t1, g6t2, g6t3, g6t4, g7t1, g7t2, g7t3, g7t4, g8t1, g8t2, g8t3, g8t4]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: chaosbot-game-*
          path: games
      - name: Board viewer
        run: |
          # (the test build of the bot's own code, for its board viewer: each loss's boards drawn in the report -- reads logs, plays nothing)
          cd chaos-bot/gambit && (gcc -O1 -pthread -DPA_HEAP -DGB_TEST -w native.c host.c test/main.c -lm -lz -o /tmp/gtest || (sudo apt-get install -y zlib1g-dev && gcc -O1 -pthread -DPA_HEAP -DGB_TEST -w native.c host.c test/main.c -lm -lz -o /tmp/gtest)) || true
      - name: Report
        env:
          GTEST: /tmp/gtest
          STORIES: losses.txt
        run: |
          python3 chaos-bot/bench/report.py games '${{ needs.plan.outputs.games }}' | tee report.txt
          for d in games/chaosbot-game-*; do n=${d##*-}; [ -f "$d/cpu.txt" ] && echo "cpu game $n: $(cat $d/cpu.txt)"; done | sort -t' ' -k3n | tee -a report.txt
          # (games and losses by runner model, any game played on a skip-list model flagged -- the owner's rule)
          python3 - <<'PY' | tee -a report.txt
          import re
          t = open('report.txt').read()
          cpu = {int(m.group(1)): m.group(2).split('|')[0].strip() for m in re.finditer(r'^cpu game (\d+): (.*)$', t, re.M)}
          tot, lost = {}, {}
          for m in re.finditer(r'^game (\d+) .* survived (\d)', t, re.M):
              mod = cpu.get(int(m.group(1)), '?'); tot[mod] = tot.get(mod, 0) + 1; lost[mod] = lost.get(mod, 0) + (1 - int(m.group(2)))
          for mod in sorted(tot, key=lambda k: -tot[k]):
              flag = '  << SKIP-LIST MODEL (played on the last try)' if re.search(r'8573C|7763|9V74', mod, re.I) else ''
              print(f'cpu model: {tot[mod]} games, {lost[mod]} lost  {mod}{flag}')
          PY
          { echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # (EVERY DECISION LABELLED -- the owner: every decision of every game in plain words with the rule that decided it, as the
          # replays had them: describe.py reads each GAMBITD line and quotes rank.c (won=k<line>) or decide.c (won=d<line>) as this
          # commit has them)
          mkdir -p decisions
          for d in games/chaosbot-game-*; do n=${d##*-}; [ -f "$d/gambit.log" ] && python3 chaos-bot/gambit/describe.py "$d/gambit.log" > "decisions/game-$n.txt" 2>&1 || true; done
          # (the time attack's own numbers, decision by decision -- the frame, the play, the chain going (tx=), the design (ta=), the aim --
          # for the games played with nobody across: the chain going read move by move, not only as the report's sums)
          for d in games/chaosbot-game-*; do n=${d##*-}; [ -f "$d/gambit.log" ] && grep '^GAMBITD .* t[xa]=' "$d/gambit.log" | awk '{o=$1" "$2; for(i=3;i<=NF;i++) if($i ~ /^(play|aim|tx|ta|pan|chain|alone|won)=/) o=o" "$i; print o}' > "decisions/ta-$n.txt" 2>/dev/null || true; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chaosbot-report
          path: |
            report.txt
            losses.txt
            decisions/
