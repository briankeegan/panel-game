name: unofficial-team-release

on:
  push:
    branches:
      - "bramp/multi-player"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read BUILD_VERSION from consts.lua
        id: build_version
        run: |
          VERSION=$(grep -E 'consts\.BUILD_VERSION\s*=' common/engine/consts.lua | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION" ]; then echo "could not find BUILD_VERSION"; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected BUILD_VERSION=$VERSION"

      - name: Build .love file
        run: ./build.sh just-love

      - name: Move .love to workspace
        run: mv ../dev-build/panel-attack.love ./unofficial-panel-attack-ffa-and-team.love

      - name: Create GitHub release
        run: |
          # Tag is a timestamp version with the "team-" prefix. The in-game
          # updater lists this repo's releases, strips the prefix, and reads the
          # remainder as a yyyy-MM-dd_hh-mm-ss version; the single .love asset is
          # the download. Each push is a unique tag, so no prior-release cleanup.
          TAG="team-$(date +'%Y-%m-%d_%H-%M-%S')"
          gh release create "$TAG" \
            unofficial-panel-attack-ffa-and-team.love \
            --target bramp/multi-player \
            --prerelease \
            --title "Unofficial Panel Attack FFA & Team — ${{ steps.build_version.outputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
