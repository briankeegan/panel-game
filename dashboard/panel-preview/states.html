// a shade of a palette colour: mixed toward black by t (0 = the exact colour)
// a tint of a palette colour: mixed toward white by t (0 = the exact colour)
function tintOf(hex,t){ const v=hex.slice(1).match(/../g).map(h=>Math.round(parseInt(h,16)+(255-parseInt(h,16))*Math.min(0.95,t))); return 'rgb('+v.join(',')+')'; }
function shadeOf(hex,t){ const v=hex.slice(1).match(/../g).map(h=>Math.round(parseInt(h,16)*(1-Math.min(0.9,t)))); return 'rgb('+v.join(',')+')'; }
// contrast against the tile: lighter for dark palette colours, darker for light ones
// one decision per colour, by hand: lighter tint or darker shade against the tile
const CONTRAST_DECISION={'#bf2836':'lighter','#bee54a':'darker','#0fe39c':'lighter','#a388ff':'lighter','#e28200':'lighter','#2536f0':'lighter','#8a93a6':'lighter'};
function contrastOf(hex,t){ const d=CONTRAST_DECISION[hex.toLowerCase()]||'lighter'; return d==='darker' ? shadeOf(hex,t) : tintOf(hex,t); }
function bhs(base,k,sat){ if(k===8) return {h:0,s:0.04}; const hs=hueSat(base); return {h:hs.h, s:sat}; }
function drawTile(k,px,py,st){
  const base=PAL[k], R=18, I=7, P=T-2*I;
  const LT=(d,extra)=>hsl(base,d+(extra||0));
  let dy=0, sx=1, sy=1, alpha=1, shadow=0.35, plateDark=0, rimBoost=0, outlineOnly=false, glow=0, pivotBottom=false, dimOverlay=0;
  if(st==='landing'){ sx=1.08; sy=0.9; pivotBottom=true; }
  if(st==='swap'){ sx=0.94; sy=0.94; }
  if(st==='hover'){ dy=-6; shadow=0.5; }
  if(st==='dim'){ plateDark=0.25; dimOverlay=0.42; }
  if(st==='pop'){ sx=0.85; sy=0.85; alpha=0.95; }
  if(st==='dead'){ plateDark=0.1; }
  if(st==='danger'){ rimBoost=0.2; }
  if(st==='flash'){ rimBoost=0.6; glow=34; }
  if(st==='flash2'){ rimBoost=0.3; glow=12; }
  if(st==='pop-out'){ plateDark=0.05; glow=10; }
  if(st==='bounce'){ sx=1.06; sy=0.92; pivotBottom=true; }
  const pivot = pivotBottom ? [px+T/2, py+T] : [px+T/2, py+T/2];
  x.save(); x.globalAlpha=alpha;
  x.translate(pivot[0], pivot[1]+dy); x.scale(sx,sy); x.translate(-pivot[0], -pivot[1]);
  const ox=px, oy=py, cx=ox+T/2, cy=oy+T/2;
  if(st==='pop'){ // popping: just the shape
    x.save(); x.shadowColor=hsl(base,0.3); x.shadowBlur=8; const rr=T*0.3*WEIGHT[k];
    x.fillStyle=hsl(base,0.22); x.strokeStyle=hsl(base,-0.3); x.lineWidth=1.5;
    if(k===8){ bang(cx,cy,rr); } else { path(x,SHAPE[k],cx,cy,rr); }
    x.fill('evenodd'); x.shadowBlur=0; x.stroke(); x.restore();
    drawFace(k,'pop',cx,cy-(k===8?0.35*rr:0),rr,base,1,1); x.restore(); return; }
  if(false){ x.save(); x.strokeStyle=hsl(base,0.5); x.lineWidth=3; x.lineCap='round';
    for(let a=0;a<8;a++){ const t=a*Math.PI/4; x.beginPath(); x.moveTo(cx+Math.cos(t)*T*0.62,cy+Math.sin(t)*T*0.62); x.lineTo(cx+Math.cos(t)*T*0.78,cy+Math.sin(t)*T*0.78); x.stroke(); }
    x.restore(); }
  if(shadow){ x.save(); x.fillStyle='rgba(0,0,0,'+shadow*0.5+')'; x.beginPath(); x.roundRect(ox+4,oy+8,T-8,T-6,R); x.fill(); x.restore(); }
  if(glow){ x.save(); x.shadowColor=hsl(base,0.45); x.shadowBlur=glow; x.fillStyle=hsl(base,0.2); x.beginPath(); x.roundRect(ox,oy,T,T,R); x.fill(); x.restore(); }
  if(st==='flash'){ // a bright halo and sparkle ticks at the corners, so the flash is unmistakable
    x.save(); x.strokeStyle=hsl(base,0.6); x.lineWidth=4; x.beginPath(); x.roundRect(ox-3,oy-3,T+6,T+6,R+3); x.stroke();
    x.strokeStyle=hsl(base,0.75); x.lineWidth=2.5; x.lineCap='round';
    [[ox-8,oy-8],[ox+T+8,oy-8],[ox-8,oy+T+8],[ox+T+8,oy+T+8]].forEach(([qx,qy])=>{ const dx=qx<cx?-1:1, dy=qy<cy?-1:1; x.beginPath(); x.moveTo(qx,qy); x.lineTo(qx+dx*6,qy+dy*6); x.moveTo(qx+dx*6,qy); x.lineTo(qx,qy+dy*6); x.stroke(); });
    x.restore(); }
  // Simple-style edge: black outline, bright lit edge, dark recessed centre
  // border: Simple's own tile (outline, lit edge and plate), recoloured to this panel's hue
  const SP={1:[1,0],2:[4,15],3:[3,-20],4:[5,-40],5:[4,-30],6:[6,-10],8:[8,0]}[k];
  // outer tile: a fade, lit top-left and falling to shade bottom-right
  // outer fade, sampled from the currently served sheet: top about #ef1b17 (lightness 0.5), bottom about #750603 (lightness 0.22), our hue
  const fhs=bhs(base,k,0.92);
  const cg=x.createLinearGradient(ox,oy,ox,oy+T);
  cg.addColorStop(0,tintOf(base,0.22)); cg.addColorStop(0.5,base); cg.addColorStop(1,shadeOf(base,0.3+plateDark));
  x.fillStyle=cg; x.beginPath(); x.roundRect(ox,oy,T,T,R); x.fill();
  // step 2: a border-only box, the same rounded shape as the outer tile, pushed into the bottom-right corner. Stroke only, no fill.
  const bl=7+3.5, bt=7+3.5, bx0=ox+bl, by0=oy+bt, bx1=ox+T-3.5, by1=oy+T-3.5;
  // the border: a richer tone of the hue. Top-left is strongest; the top edge fades out toward the top-right,
  // the left edge fades out well before the bottom-left; a short quicker dash sits in the bottom-right corner.
  { const sC=contrastOf(base,(CONTRAST_DECISION[base.toLowerCase()]==='darker'?0.6:0.3)).slice(4,-1);   // pinker: saturated, lighter tone of the hue
    const bwid=bx1-bx0, bhei=by1-by0, rr=Math.max(2,R-7);
    x.lineWidth=7; x.lineCap='butt';
    const FD=Math.min(bwid,bhei)*0.8, FDt=bwid, FDl=bhei;   // each edge fades out at its far corner
    const tg=x.createLinearGradient(bx0,by0,bx0+FDt,by0);
    tg.addColorStop(0,'rgba('+sC+',1)'); tg.addColorStop(0.2,'rgba('+sC+',1)'); tg.addColorStop(0.45,'rgba('+sC+',0.6)'); tg.addColorStop(0.75,'rgba('+sC+',0.15)'); tg.addColorStop(1,'rgba('+sC+',0)');
    x.strokeStyle=tg; x.beginPath(); x.moveTo(bx0+rr,by0); x.lineTo(bx0+FDt,by0); x.stroke();
    const lg=x.createLinearGradient(bx0,by0,bx0,by0+FDl);
    lg.addColorStop(0,'rgba('+sC+',1)'); lg.addColorStop(0.2,'rgba('+sC+',1)'); lg.addColorStop(0.45,'rgba('+sC+',0.6)'); lg.addColorStop(0.75,'rgba('+sC+',0.15)'); lg.addColorStop(1,'rgba('+sC+',0)');
    x.strokeStyle=lg; x.beginPath(); x.moveTo(bx0,by0+rr); x.lineTo(bx0,by0+FDl); x.stroke();
    // the rounded top-left corner itself, in full colour
    x.strokeStyle='rgba('+sC+',1)'; x.beginPath(); x.arc(bx0+rr,by0+rr,rr,Math.PI,1.5*Math.PI); x.stroke();
    // the top-left corner itself, which the two edge strokes leave out: fully opaque, fading out quickly
    const cgc=x.createRadialGradient(bx0,by0,0,bx0,by0,rr*2.2);
    cgc.addColorStop(0,'rgba('+sC+',1)'); cgc.addColorStop(1,'rgba('+sC+',0)');
    x.strokeStyle=cgc; x.beginPath(); x.roundRect(bx0,by0,bwid,bhei,rr); x.stroke();
    const fr2=Math.min(bwid,bhei)*0.4;
    const wg2=x.createRadialGradient(bx1,by1,0,bx1,by1,fr2);
    wg2.addColorStop(0,'rgba('+sC+',1)'); wg2.addColorStop(0.5,'rgba('+sC+',0.6)'); wg2.addColorStop(1,'rgba('+sC+',0)');
    x.strokeStyle=wg2; x.beginPath(); x.roundRect(bx0,by0,bwid,bhei,rr); x.stroke(); }
  // this shape and its face sit a few pixels lower for the star, bolt and exclamation mark
  x.save(); x.translate(0,({2:4,5:4,8:4}[k]||0));
  const r=T*0.3*WEIGHT[k];
  if(st==='pop-out'){ // garbage pop: the shape breaks out with a glow and sparkles
    x.save(); x.shadowColor=hsl(base,0.35); x.shadowBlur=12; x.fillStyle=hsl(base,0.2); if(k===8){ bang(cx,cy,r); } else { path(x,SHAPE[k],cx,cy,r); } x.fill('evenodd'); x.restore();
    x.save(); x.fillStyle=hsl(base,0.4); for(let a=0;a<6;a++){ const t=a*Math.PI/3+0.3; const d=T*0.4; x.beginPath(); x.arc(cx+Math.cos(t)*d,cy+Math.sin(t)*d,2.2,0,Math.PI*2); x.fill(); } x.restore();
  }
  else {
    x.save(); x.shadowColor='rgba(0,0,0,0.35)'; x.shadowBlur=4; x.shadowOffsetY=1.5;
    const sg=x.createLinearGradient(cx,cy-r,cx,cy+r); const pinkC=contrastOf(base,0.5); sg.addColorStop(0,pinkC); sg.addColorStop(1,pinkC);   // same colour as the border
    x.fillStyle=sg;
    if(k===8){ bang(cx,cy,r); } else { path(x,SHAPE[k],cx,cy,r); }
    x.fill('evenodd'); x.shadowBlur=0;   // no outline around the shape
    x.restore();
  }
  if(k===8 && !outlineOnly){ drawFace(k,st,cx,cy-0.35*r,r,base,alpha,1); }
  if(!outlineOnly && k!==8){
    const sa=(st==='face'||st==='pop'||st==='flash')?1:(st==='dim'?0.6:1);
    drawFace(k,st,cx,cy,r,base,1,sa);
  }
  x.restore();
  if(dimOverlay){ x.fillStyle='rgba(0,0,0,'+dimOverlay+')'; x.beginPath(); x.roundRect(ox,oy,T,T,R); x.fill(); }
  x.restore();
}
const COLS=STATES.length, CW=96, GAP=14, LEFT=110;
const rows=[1,2,3,4,5,6,8];
const SIMG={}; let loadedN=0; const need=[1,2,3,4,5,6,8];
function renderAll(){
  x.clearRect(0,0,c.width,c.height);
  x.fillStyle='#e8ebf3'; x.font='13px system-ui,sans-serif'; x.textAlign='center';
  LABELS.forEach((l,i)=>{ x.fillText(l, LEFT+i*(CW+GAP)+CW/2, 30); });
  rows.forEach((k,ri)=>{
    const y=50+ri*(CW+GAP);
    x.fillStyle='#8a93a6'; x.textAlign='left'; x.fillText(['Red','Yellow-green','Green','Purple','Orange','Blue','Shock'][ri], 8, y+CW/2+4);
    STATES.forEach((st,ci)=>{ drawTile(k, LEFT+ci*(CW+GAP), y, st); });
  });
}
need.forEach(n=>{ const im=new Image(); im.onload=()=>{ SIMG[n]=im; if(++loadedN===need.length) renderAll(); }; im.onerror=()=>{ if(++loadedN===need.length) renderAll(); }; im.src='simple'+n+'.png'; });
</script></body></html>
