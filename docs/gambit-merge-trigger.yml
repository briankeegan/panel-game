# For the GameCreator repo: put this at .github/workflows/redeploy-panel-attack-bots.yml there.
#
# When a change to Gambit (or its profile) merges to main, ask this fork's ranmaru-deploy to redeploy the bots that are already
# deployed. Only those paths trigger it, and ranmaru-deploy with `only-if-running` does nothing on a server where no numbered
# bot (Ranmaru_p9_CPU) is up. A newer merge cancels the two-minute wait, so a burst of merges redeploys once.
#
# Needs one secret in GameCreator: PANEL_GAME_TOKEN, a fine-grained token for briankeegan/panel-game with Actions: Read and write.
name: Redeploy the Panel Attack bots when Gambit changes

on:
  push:
    branches: [main]
    paths:
      - 'games/the-game/ai/gambit/**'
      - 'games/the-game/ai/eval/survivor-profiles/**'

concurrency:
  group: redeploy-panel-attack-bots
  cancel-in-progress: true

jobs:
  redeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for two quiet minutes
        run: sleep 120

      - name: Ask for the redeploys
        env:
          TOKEN: ${{ secrets.PANEL_GAME_TOKEN }}
        run: |
          for server in panelattack.com:49569 betaserver.panelattack.com:59569; do
            curl -fsS -X POST \
              -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/briankeegan/panel-game/actions/workflows/bot-prod-smoke-test.yml/dispatches \
              -d "{\"ref\":\"bramp/multi-player\",\"inputs\":{\"mode\":\"ranmaru-deploy\",\"server\":\"$server\",\"bot\":\"gambit\",\"name\":\"Ranmaru_p#_CPU\",\"hours\":\"5\",\"advanced\":\"only-if-running\"}}"
          done
